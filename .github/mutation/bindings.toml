# The wrapping, mutated. Coverage says every line of it runs -- the ratchet
# in pyproject.toml is at 100% and has no slack -- and this asks whether the
# suite would notice if one of those lines were wrong.
#
# The gap is not theoretical for this package, and the shape of its own code
# is why. What is hand-written here is a boundary: `if len(x) != 32: raise`,
# `if not 0 < scalar < n: raise`, a return code checked against zero. Change
# `!=` to `<=`, or 32 to 31, and the line still runs and coverage still
# reads 100% -- what kills that mutant is a test that passes 31 octets *and*
# one that passes 33.
#
# The first session answered that, and the answer was that not every bound
# had both: mutation testing found survivors on a tree already at 100%
# statement coverage -- two questions with different answers, which is the
# whole reason this configuration exists. Most of those survivors were the
# inert shape the operator filter below now skips; the rest were real.
#
# The tests the real ones asked for are in tests/ now, and a second
# session found the comparison and loop mutants dead except for a handful
# of recid bounds and a message-hash check, killed by hand afterwards --
# each mutation applied to the source and the suite watched to fail. What
# the session that measured the filter below still found, past that, was
# two shapes that no test could kill, and neither is there any more --
# because each was a question about the code rather than about the suite:
#
#   ffi.new("size_t *", 73) -> 74 or 72, the capacity of an output buffer,
#   written as a second copy of the buffer's own size.
#   `ffi.sizeof` now derives the capacity from the buffer and the buffer is
#   what is unpacked, so a wrong size reaches the caller instead of being
#   absorbed. The DER buffer went with them: 73 was slack over a
#   serialization that cannot exceed 72, so shrinking it was a mutant no
#   test could distinguish, and at the 72 it is now
#   `test_der_reaches_all_72_octets` reaches the last octet and 71 dies
#
#   secrets.token_bytes(32) -> 31 or 33, randomness this package generates
#   rather than accepts: a BIP340 aux, an ellswift encoding, the context
#   seed -- unkillable through any answer, a shorter aux being hashed into
#   a different signature that verifies just as well.
#   What holds them now is what is *asked* of `secrets` rather than what
#   comes back, so the context seed is randomized through a function taking
#   the context as an argument, the way `_load_lib` takes the module
#
# The session that measured that is in the pull request which made it
# true. What a scheduled run finds is read off `bindings-survivors.txt`,
# the artifact the workflow uploads, and only a sweep that reached every
# mutant is read: one cut at its budget says `never run` in its own
# summary line and has no verdict for what it never reached. A survivor of
# a complete sweep is a test nobody has written, or one of the kinds below,
# which no test worth writing can kill; the diff `cr-report --show-diff`
# prints says which, without another session. Each kind is a shape, so the
# sites in the tree are what a search for the shape finds and not a list
# kept here:
#
#   A mutant inside an `@overload` stub, which is never run: the
#   implementation's `def` replaces the stub when the module is imported,
#   and the operators excluded below take out only the decorator. A
#   signature closing in `: ...` is one -- a default such as `attempt: int
#   = 0` mutated to 1, or the keyword-only marker `*` mutated to `/`. That
#   same `/` in a signature with a docstring after it is not this kind:
#   there an argument becomes passable by position, and a test that passes
#   it so kills it.
#
#   `type(value) is bytes` -> `==`. A class equals itself and nothing else
#   unless its metaclass defines `__eq__`, so every argument a caller can
#   hand in takes the same branch either way; killing it takes a metaclass
#   written for the mutant.
#
#   `ctype.kind != "array"` -> `>`. cffi's kinds are primitive, pointer,
#   array, struct, union, enum, function and void, and none sorts below
#   `"array"`, so `>` is true of every kind `!=` is.
#
#   `!=` or `==` between two integers -> `is not` or `is`, against a named
#   constant, as in `len(x) != _XONLY_SIZE`. A literal there is a
#   SyntaxWarning, which `filterwarnings = ["error"]` makes a syntax error
#   and so a kill; a name is not one. CPython caches the integers up to 256,
#   so identity and equality agree wherever both sides are that small.
#
#   `zip(..., strict=False)` -> `True` in `keys.pubkey_tweak_mul_sum`, whose
#   length check above it has already raised for every input the two
#   differ on.
#
#   `len(pubkey_bytes) == _XONLY_SIZE` -> `<=` in `xonly.to_pubkey`. A value
#   shorter than 32 takes the other branch under the mutant, and `keys.parse`
#   refuses it there as it refuses it in the branch it takes without: the
#   same exception, the same message.
#
# The number the workflow prints is the survivors over what ran, and it is
# not a measure of the suite by itself. The kinds above are in it and no
# test lowers it past them, and the kills are not all tests noticing: a
# mutant that stops the package importing is killed by whichever test is
# collected first. A run is read against the one before it and against
# the list, and the rate moves when a test is written or a kind is
# recorded here.
#
# One thing to know that is not a survivor at all, and is the reason a
# falling mutant count is not by itself a tighter suite (#231).
# #221 collapsed every buffer width in the package to one statement, and in
# two modules that turned several independently mutable copies of a number
# into one: `ellswift` had 64 at `_decode_` and at both of `xdh`'s length
# checks, and `ssa` had it at `_verify_` and at `verify`.
# `core/NumberReplacer` carries `OFFSETS = [+1, -1]` and yields a position
# per offset, so where each of `ellswift`'s separate literals used to give
# its own pair of mutants, the one shared constant now gives a single pair
# for every site together -- and either of those two mutants changes every
# site at once and dies on whichever test reaches it first. Nothing is
# hidden today: every constant #221 introduced was mutated both ways before
# it landed, bytecode writing off and a control run either side, and every
# one of those mutants dies. What is gone is resolution for the
# session after next: a check that later loses the test covering it can no
# longer surface here, because the mutant that would have reported it is
# killed elsewhere. So this is the mirror of the two shapes above -- not a
# survivor to skip, but a silence to know about. The ratchet catches a lost
# test only where losing it stops the line running at all; a check still
# executed by some other test and asserted by none is what neither
# question sees, and one constant is now the whole of what would have
# asked about it.
#
# That is a statement about the shapes, not a promise about the rate:
# what the next scheduled run reports is what it reports, and it is not
# restated here, a number in a comment being a line every change to the
# suite would edit.
#
# Here rather than at the repository root: cosmic-ray takes the path of its
# configuration as an argument, so nothing forces a name or a place, and
# this repository runs no check-manifest to make a root file's placement
# something that needs recording. What that tool would ask -- whether the
# sdist carries what a build from it needs -- is answered here instead by
# suite-sdist in test.yml, which installs from the built sdist and compiles
# the vendored library on every platform its matrix covers; this file plays
# no part in that build, so where it sits does not bear on the question.
# .github/ is simply where the rest of the CI configuration already lives.
#
# A sibling repository in the organization needs two files rather than
# one, and the asymmetry that makes it want two is absent here: there the
# two halves of its scope differ in what a mutant costs, so one shared test
# command would make every cheap mutant pay the expensive one's price.
# Here one command is the right one for the whole scope.

[cosmic-ray]
# the package, not one module: scoping it further would be excluding code
# from the question rather than dividing the work. A module added at the
# top of it is in scope without this line being edited, and a subpackage is
# too unless `excluded-modules` below names it. `cosmic-ray init`
# enumerates the mutants without running any, so how many there are is a
# command rather than a number here. The sessions quoted below are records
# of what was judged, not of what a run counted -- a scheduled run prints
# the count, and this file does not repeat it.
# The vendored C is not in it and cannot be -- libsecp256k1 is upstream's,
# and what this repository is answerable for is how the bindings drive it
module-path = "src/btclib_secp256k1"

# the whole suite. One mutant costs one run of it, so a session is as long
# as the mutants it runs times what `cosmic-ray baseline`, which runs it
# once unmutated, takes; a survivor costs the whole run and a kill only as
# far as its first failure.
#
# -x stops at the first failure: a mutant needs one test to kill it, and the
# rest of the run is spent proving what is already known.
# -p no:randomly because pytest-randomly is in the test group: with -x the
# collection order decides which test does the killing, so a shuffled order
# makes both the runtime and a timeout verdict irreproducible.
# -q because the log is not a terminal.
#
# --no-cov, against the --cov addopts carries: a mutant is reached by no
# test on purpose, so the ratchet would fail every single run and report
# every mutant as killed by the gate rather than by a test
test-command = "python -m pytest -x -q -p no:randomly --no-cov"

# seconds of wall clock. What this guards is a mutant that turns a bound
# into a loop with no exit, and nothing else. Wide rather than tight,
# because a timeout is a verdict of its own -- neither killed nor survived
# -- so every second of slack a loaded machine needs is a survivor not
# reported as noise. One run of the suite is what `cosmic-ray baseline`
# times, and 120 is wide against it; the limit costs nothing except on the
# mutants that do hang
timeout = 120

# the `zkp` subpackage, and no module of the rest: `_scalar` and `context`
# are as much the boundary as the wrappers are, and `__init__` more than
# either -- `_load_lib` is the one branch whose other half no build has,
# which is why it takes the module as an argument. A mutant surviving in
# there is worth knowing about.
#
# `zkp` is out because this session cannot judge it. The extension behind
# it is built only with `BTCLIB_LIBSECP256K1_ZKP`, which no step of the
# session sets, so the tests marked `zkp` skip and a mutant of `zkp` is
# judged by what runs without the library: the tests written against a
# stand-in for it, and the collection of the suite, which imports every
# module. A kill there is a test noticing, but a survivor is not a test
# missing -- it may be one that only the skipped tests would kill -- so a
# list holding them overstates the gap by an amount nothing in it says, and
# is read as a list of tests nobody has written.
#
# What brings it in is a session whose environment builds the extension
# with that variable set, which the workflow this tree calls has no input
# for (btclib-org/.github#1202). Until then this line is an honest gap, and
# what tests `zkp` is the flagged suite CONTRIBUTING.md documents. A module
# is excluded by a glob relative to the repository root
excluded-modules = ["src/btclib_secp256k1/zkp/**/*.py"]

# Three operators are excluded, each for a different reason and each with a
# claim about the tree that is the thing to re-check rather than the comment
# beside it: a mutant excluded is one no session reports. Excluded by
# operator and not with `# pragma: no mutate`, because the workflow this
# tree calls runs `cr-filter-operators` and no `cr-filter-pragma`, so a
# marker would filter nothing; the decision is one line here, in the file
# that already says what is mutated and what judges it.
#
# `core/ReplaceBinaryOperator_BitOr_.*`, which is a mutant of `bytes | int`
# being nothing. Every module of the top level but `__init__` opens with
# `from __future__ import annotations`, so an annotation is an unevaluated
# string, and cosmic-ray mutates the `|` inside it eleven ways -- `bytes >>
# int` and ten more -- none of which any test can reach, because nothing
# ever evaluates the expression. The claim is a grep:
#
#   grep -n ' | ' src/btclib_secp256k1/*.py
#
# Every hit is an annotation, bar the two evaluated `|` there are:
# `BytesLike` and `MutableBytesLike` in `__init__.py`, unions built when the
# package is imported. Those the filter hides too, and hides no survivor:
# none of the eleven replacements is defined between two classes, so each
# of their mutants raises TypeError as the suite is collected and is
# killed there. Run with `module-path` on `__init__.py` alone and no
# filter, they all die that way. There is no bitwise operator of any kind in
# the package -- no `^`, no `&`, no shift outside a doctest prompt -- which
# is why the pattern excludes the BitOr family and nothing else. A sibling
# repository in the organization keeps the same exclusion that narrow for
# the opposite reason: `^` is what one of its own checks is written with.
#
# The pattern is anchored on what is *replaced*, which is what leaves the
# one BitOr mutant a test does kill: `2**256` in _scalar.py mutated to
# `2 | 256` is `core/ReplaceBinaryOperator_Pow_BitOr`, so it does not match
# and it still runs, dying on the int scalar test written for it.
#
# `core/RemoveDecorator`, which here removes an `@overload`: a stub is
# replaced by the implementation's `def` when the module is imported, so
# the stub with or without its decorator is a function nobody can call. The
# claim is that `@overload` is the only decorator in the package, and it is
# a grep whose second command prints nothing:
#
#   grep -rn '^ *@' src/btclib_secp256k1 | grep -c '@overload$'
#   grep -rn '^ *@' src/btclib_secp256k1 | grep -v '@overload$'
#
# A `@property`, `@staticmethod` or `@dataclass` written into it would be
# skipped in silence, so the second command is what a change adding one
# must run first.
#
# `core/ReplaceBinaryOperator_Mul_` with every replacement but `Div`, which
# is a mutant of a `*` that is not a multiplication. A bare `*` is the
# keyword-only marker of a signature, and parso, so cosmic-ray, reads it as
# a binary operator. Of its eleven replacements only `/` leaves a signature
# Python accepts -- `a, /, b` makes `a` positional-only and `b`
# positional-or-keyword -- so the other ten are a syntax error in the module
# as it is imported, killed as the suite is collected: kills that say
# nothing about any test, each costing a start of pytest. `Div` is kept
# because it is not noise:
# in an `@overload` stub it survives by construction, which is the first
# kind recorded above, while in an implementation it accepts a keyword-only
# argument positionally, which a test that passes it so kills.
#
# The claim behind the ten is that no `*` in the swept scope is a
# multiplication, which is a question for the syntax tree -- a grep cannot
# tell a marker from an operator -- and prints nothing today:
#
#   python3 - src/btclib_secp256k1/*.py <<'EOF'
#   import ast, sys
#   for path in sys.argv[1:]:
#       for node in ast.walk(ast.parse(open(path).read())):
#           if isinstance(node, (ast.BinOp, ast.AugAssign)):
#               if isinstance(node.op, ast.Mult):
#                   print(path, node.lineno)
#   EOF
#
# The same command over `src/btclib_secp256k1/zkp/*.py` prints the one
# there is, `32 * len(pubkeys)` in `rangeproof.py`, where the ten would be
# skipped in silence: bringing `zkp` back into scope means narrowing this
# pattern first.
#
# What the exclusions do to the one number the workflow prints is why
# .github/scripts/mutation_counts.py exists: `cr-rate` counts anything that
# is not SURVIVED as a kill, a skip included, so on a filtered session it
# divides by mutants nothing ran
[cosmic-ray.filters.operators-filter]
exclude-operators = [
    "core/ReplaceBinaryOperator_BitOr_.*",
    "core/RemoveDecorator$",
    "core/ReplaceBinaryOperator_Mul_(?!Div$)",
]

# one mutant at a time, in this working tree. The local distributor writes
# the mutation into the file itself and restores it afterwards, so a second
# session -- or a pytest in another shell -- would read mutated source. The
# http distributor is what cosmic-ray offers instead, and it wants a worker
# per checkout: parallelism at the price of a clone each, for a session that
# already fits in the budget
[cosmic-ray.distributor]
name = "local"
