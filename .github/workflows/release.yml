---
name: release

# publish to PyPI with Trusted Publishing (OIDC): no long-lived PyPI
# token exists anywhere; PyPI trusts this very workflow (registered in
# the PyPI project settings under "Publishing") and hands out a
# short-lived upload token at run time.
# See RELEASING.md.

on:
  push:
    tags: ["v*"]
  # rehearsal: a manual run publishes to TestPyPI, a tag to PyPI, and
  # there is nothing to choose at dispatch time. A version cannot be
  # reuploaded to either index, so the one thing this workflow must not
  # do is reach PyPI when it was meant to be a trial run
  workflow_dispatch:

permissions:
  contents: read

# never cancel a release, unlike the gates it calls: what cancel-in-progress
# is right about elsewhere is that the subject of a run is a commit, which a
# newer commit supersedes. A publication is not -- a version is consumed by
# the upload that carries it, and a run cancelled between the two uploads
# leaves TestPyPI holding a version PyPI never got. Two tags pushed in a row
# queue instead. Named literally, for the reason lint.yml gives at length
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the same gates a push gets, all three of them: a release is not the
  # moment to discover that the tagged commit does not lint, does not build
  # its documentation, or does not pass the suite on a platform
  lint:
    name: Run the lint workflow
    uses: ./.github/workflows/lint.yml # zizmor: ignore[self-repository]
    with:
      # what keeps this run out of the branch concurrency groups: inside a
      # called workflow github.ref is the ref of this workflow's own run,
      # so without it a rehearsal dispatched on a branch and a push to that
      # branch share a group and cancel each other. The reasoning is in
      # lint.yml, next to the group; the value only has to be a string no
      # branch group can contain
      concurrency-suffix: "-release"

  docs:
    name: Run the docs workflow
    uses: ./.github/workflows/docs.yml # zizmor: ignore[self-repository]
    with:
      # see the lint job above
      concurrency-suffix: "-release"

  # the suite on every platform and every interpreter, which test.yml runs
  # one cell of, for the reason os-ubuntu.yml's header gives: a week is the
  # right sample rate for a regression that can sit on main for a week,
  # and the wrong one for a version that cannot be unpublished
  ubuntu:
    name: Run the ubuntu workflow
    uses: ./.github/workflows/os-ubuntu.yml # zizmor: ignore[self-repository]
    with:
      # see the lint job above
      concurrency-suffix: "-release"

  macos:
    name: Run the macos workflow
    uses: ./.github/workflows/os-macos.yml # zizmor: ignore[self-repository]
    with:
      # see the lint job above
      concurrency-suffix: "-release"

  windows:
    name: Run the windows workflow
    uses: ./.github/workflows/os-windows.yml # zizmor: ignore[self-repository]
    with:
      # see the lint job above
      concurrency-suffix: "-release"

  # what a version cannot survive being wrong about, checked before
  # anything is built and long before anything is uploaded: a version is
  # consumed by the upload that carries it, and can then only be yanked.
  # The rehearsal runs this too, so a mismatch cannot wait for release
  # day to surface.
  #
  # The checkout, the lock check, the ancestry check, the version
  # comparison, the retitling check and the rehearsal suffix are
  # btclib-org/.github's: reusable-version-check.yml, called at @main so
  # a fix there reaches this tree in one landing (section 10 of its
  # README.md). tag-requires-day is false, the one non-default caller in
  # the family: 0.8.0.7 tracks libsecp256k1's own release rather than a
  # calendar date, and the shared check would refuse every release this
  # tree can cut otherwise. submodule-pin-release, below, is this tree's
  # own job, kept out of the called workflow for the reason its own
  # header gives (btclib-org/.github#35)
  version-check:
    uses: btclib-org/.github/.github/workflows/reusable-version-check.yml@main
    with:
      tag-requires-day: false

  # the version of the wrapped library is a second thing this package
  # declares twice: the tag named in README.md, and the commit the
  # submodule is pinned to. This does not come into
  # reusable-version-check.yml, in any shape: an input whose only
  # non-default caller is one repository is the copy-in-disguise failure
  # btclib-org/.github#35's own test refuses, and this gates a fact about
  # the tree rather than about the tag or the declared version, which is
  # what every step of that shared job is about. It stays as this
  # repository's own job, beside the publishing jobs that already stay.
  #
  # The tag is resolved at the source rather than through a submodule
  # checkout, whose shallow clone carries no tags, so this job's checkout
  # takes neither `submodules:` nor `fetch-depth: 0`: `git ls-tree HEAD
  # secp256k1` reads the pinned commit off the tree object HEAD already
  # carries, and `git ls-remote` resolves the upstream tag directly, over
  # the network.
  # Why README.md's prose stays the one declared claim, and the hazard of
  # the sed expression below taking the *first* such link in the file
  # rather than the "## Versioning" one by name, is
  # check_submodule_pin.py's module docstring
  # (btclib-org/btclib-secp256k1#429): this step's sed is that hook's
  # `_NAMED` again, kept in step with it. Gated on publishing below
  # through `needs`, the same way version-check was before this job split
  # out of it
  submodule-pin-release:
    name: Check that README.md names the pinned libsecp256k1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that README.md names the pinned libsecp256k1
        run: |
          named=$(sed -n 's|.*secp256k1/releases/tag/\(v[0-9][0-9.]*\).*|\1|p' README.md | head -1)
          pinned=$(git ls-tree HEAD secp256k1 | awk '{print $3}')
          upstream=https://github.com/bitcoin-core/secp256k1
          tagged=$(git ls-remote "$upstream" "refs/tags/$named^{}" | cut -f1)
          echo "README.md names $named ($tagged); the submodule is pinned to $pinned"
          if [ -z "$named" ] || [ -z "$tagged" ]; then
            echo "::error::README.md names no libsecp256k1 release, or one that does not exist"
            exit 1
          fi
          if [ "$tagged" != "$pinned" ]; then
            echo "::error::the submodule is pinned to $pinned, which is not $named"
            exit 1
          fi

  # the secp256k1-zkp pin is a commit of fametrano/secp256k1-zkp, whose
  # expose-borromean-verify branch is rebased onto upstream's master, so
  # a pin stops being on any branch of the fork at the next rebase, and
  # GitHub may prune a commit no ref reaches -- after which "Rebuild a
  # release from its tag" in RELEASING.md fails at its `git submodule
  # update` (#988). The ref that holds it is the tag
  # btclib-secp256k1-<release tag>, which RELEASING.md pushes to the fork
  # before the release tag; this job asks that it peels to the commit the
  # tree pins, before publish-pypi uploads anything. `^{}` peels only an
  # annotated tag, so a lightweight one fails here too; the signature is
  # `git tag -v` in that step, as for the release tag. Release-only, as
  # `documented` is: a rehearsal's version is tagged in neither
  # repository. `git ls-tree` and `git ls-remote` for the reason
  # submodule-pin-release gives above. The job goes when #841 re-points
  # the submodule at BlockstreamResearch/secp256k1-zkp
  zkp-pin-tag:
    name: Check that the fork tags the pinned secp256k1-zkp commit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the fork tags the pinned secp256k1-zkp commit
        env:
          FORK: https://github.com/fametrano/secp256k1-zkp
          TAG: btclib-secp256k1-${{ github.ref_name }}
        run: |
          pinned=$(git ls-tree HEAD secp256k1-zkp | awk '{print $3}')
          tagged=$(git ls-remote "$FORK" "refs/tags/$TAG^{}" | cut -f1)
          echo "$FORK tags $TAG at ${tagged:-nothing}; the submodule is pinned to $pinned"
          if [ -z "$tagged" ]; then
            echo "::error::$FORK carries no annotated tag $TAG -- see RELEASING.md"
            exit 1
          fi
          if [ "$tagged" != "$pinned" ]; then
            echo "::error::$TAG is $tagged, not the pinned $pinned"
            exit 1
          fi

  # the pinned secp256k1-zkp commit is close to upstream's master and
  # signed by a recognized signer: zkp-pin.yml, the check
  # vendored-vectors.yml runs as a sentinel. A pull request that moves the
  # gitlink to a commit of any fork of the network passes every required
  # check (issue #1086), so the publish jobs wait for this one. Unlike
  # zkp-pin-tag it runs on a rehearsal too, whose upload it also withholds.
  # A publish job runs only where this job's result is `success`; a rerun
  # of the failed job releases it
  zkp-pin:
    name: Check the pinned secp256k1-zkp commit
    uses: ./.github/workflows/zkp-pin.yml # zizmor: ignore[self-repository]
    with:
      # see the lint job above
      concurrency-suffix: "-release"

  # walks the public API of the release before this one against the one
  # being cut and reports what broke: a removed object, a changed
  # parameter kind or default, a narrowed type. It runs here rather than
  # as a merge gate -- btclib-org/.github#326's own decision -- because
  # before 1.0 the surface breaks deliberately and often, and a gate
  # reporting every such break on every pull request has nothing to say
  # about which ones are allowed. Here the answer arrives while
  # RELEASE_NOTES.md is already being written, so a break with no entry
  # is refused at the moment somebody is already writing entries.
  #
  # The checkout, the previous-tag resolution and the griffe walk are
  # btclib-org/.github's: reusable-public-api.yml, called at @main so a
  # fix there reaches this tree in one landing (section 10 of its
  # README.md). package is the one input the family has no default for,
  # the equality with the repository name being a coincidence of four
  # trees and not a rule (btclib-org/.github#35)
  public-api:
    uses: btclib-org/.github/.github/workflows/reusable-public-api.yml@main
    with:
      package: btclib_secp256k1

  # `uv audit` over what the wheel declares, before anything is published:
  # btclib-org/.github's reusable-audit.yml, called at @main so that the uv
  # version, the flags and what it refuses are written once. An
  # advisory or an unreachable service fails it, and the publish jobs
  # below name it in `needs:` and in their `if:`, `always()` there being
  # what would otherwise let them run past a red one. The callee asks only
  # for the `contents: read` this workflow grants, as the calls above do.
  # github-release does not name it: it runs only after publish-pypi
  # succeeds
  audit:
    uses: btclib-org/.github/.github/workflows/reusable-audit.yml@main

  # the sdist, the bill of materials and their signature:
  # btclib-org/.github's reusable-build.yml, called at @main (section 10 of
  # its README.md). It builds the sdist and the bill of materials, uploads
  # them as `sdist` and `sbom`, and signs them before any publish job
  # waits for its environment's approval, from a workflow this tree's own
  # steps cannot alter (SLSA Build L3). It uploads the bundle as
  # `attestation` for github-release. The wheels are not built here, so
  # that statement does not cover them: test.yml's matrix builds them, and
  # their provenance is the PEP 740 attestation the publish jobs upload.
  #
  # python is the interpreter .python-version pins: under setup-python the
  # callee's `uv run` reads that file with downloads off, and
  # RELEASING.md's rebuild normalizes the sdist with it, so another value
  # fails the build or the rebuild. tests/interpreters_test.py holds the
  # two equal. dist-artifact is `sdist`, the name the publish jobs and
  # github-release download, and test.yml uploads no `sdist` or `sbom` of
  # its own on this path, so the names do not collide. The version-suffix
  # output is empty on the tag path, where version-check skips the step
  # that writes it: a release ships the version the tree declares
  build:
    name: Build and sign the sdist
    needs: version-check
    # a called workflow's own permissions: block can only downgrade what
    # this job grants (btclib-org/.github#912), so every scope the callee
    # declares is named here: contents: read at its workflow level, the
    # two writes on its attest job
    permissions:
      contents: read
      id-token: write # the OIDC token the callee's attest job mints
      attestations: write # the build provenance attestation it writes
    uses: btclib-org/.github/.github/workflows/reusable-build.yml@main
    with:
      python: "3.15"
      version-suffix: ${{ needs.version-check.outputs.version-suffix }}
      submodules: true
      setup-python: true
      sdist-only: true
      dist-artifact: sdist

  # reuse the whole build/test pipeline: every wheel the release ships is
  # built and tested here, by the very matrices that run on a push, and
  # the sdist the build job signed is checked and installed here
  test:
    name: Run the test workflow
    # a minute of checking, ahead of an hour of building: a tag that does
    # not match the tree is worth discovering before the matrices start.
    # build, because the sdist jobs over there download its upload
    needs: [version-check, build]
    uses: ./.github/workflows/test.yml # zizmor: ignore[self-repository]
    # a called workflow's jobs are capped at what the caller grants here.
    # A scope a job over there declares and this list leaves off is not
    # quietly dropped: the run is refused before a single job starts,
    # version-check included. This workflow's contents: read alone left
    # `changes`, whose own call to `btclib-org/.github`'s
    # `reusable-changes.yml` asks for pull-requests: read to list a pull
    # request's files, "only allowed pull-requests: none". `changes` never
    # runs on a pull request here -- it answers code=true unconditionally
    # and reads no file list -- but the check is against what the job
    # declares, not against what it goes on to do.
    #
    # The cap bounds what the called workflow declares rather than
    # standing in for it: a job over there with no block of its own is
    # granted test.yml's own top-level contents: read and not the caller's
    # pull-requests: read. contents: read is repeated here to keep that
    # top-level declaration inside the cap. What a run does where the
    # called workflow's top-level declaration falls outside the cap is not
    # measured; the refusal above is what a job's own declaration draws,
    # and the two need not behave alike (btclib-org/.github#912)
    permissions:
      contents: read
      pull-requests: read # capping test.yml's own changes job, for the file list of a pull request
    with:
      # empty on the tag path, where the step computing it is skipped and
      # a skipped step's output is the empty string: a release ships the
      # version the tree declares
      version-suffix: ${{ needs.version-check.outputs.version-suffix }}
      # the sdist the jobs over there check is the one the build job signed
      use-signed-dist: true
      # see the lint job above
      concurrency-suffix: "-release"

  # the two publish jobs differ only in where they upload to, and are two
  # jobs rather than one parameterized by an expression on purpose. The
  # environment name is what enforces the manual approval: were it an
  # expression that failed to evaluate as intended, the job would run
  # against some other environment, publishing with no gate in front of
  # it. Nothing here is computed, so nothing can go that way.
  #
  # Both cap their runtime like every other job, the approval they wait
  # for notwithstanding: what timeout-minutes bounds is execution time,
  # which is also what the six-hour default bounds, while a run waiting
  # for an environment approval has a limit of its own, thirty days. The
  # reviewer can therefore take as long as they like, and a stuck upload
  # still cannot hold a runner for an afternoon
  publish-testpypi:
    name: Publish to TestPyPI
    # the repository condition keeps a fork from attempting an upload it
    # has no publisher for: a fork that pushes a tag, or dispatches this
    # workflow, gets the build and stops there
    #
    # public-api stays in `needs` for the ordering -- its own comment
    # says why the reading is worth having before the upload -- and not
    # for its result: it exits 1 on a break in the public surface that
    # RELEASE_NOTES.md does not name, and a bare `needs` refuses to start
    # this job when any listed job failed or was skipped. `always()` is
    # what opts back in, and the `.result` checks beside it are what keep
    # every other listed job the gate it is. Section 12 of the
    # organization standard has the rule; github-release's comment below
    # is this tree's own measurement of the same refusal, behind a skipped
    # job rather than a failed one.
    # submodule-pin-release is checked for its result unlike public-api: before
    # this job split out of version-check, a mismatched pin failed that
    # job outright, which skipped `test` (a bare `needs: version-check`)
    # and so refused this job through `needs.test.result`. The split
    # keeps that refusal explicit rather than losing it to the new shape
    if: >-
      always() && github.event_name == 'workflow_dispatch'
      && github.repository == 'btclib-org/btclib-secp256k1'
      && needs.test.result == 'success' && needs.lint.result == 'success'
      && needs.docs.result == 'success' && needs.ubuntu.result == 'success'
      && needs.macos.result == 'success' && needs.windows.result == 'success'
      && needs.submodule-pin-release.result == 'success'
      && needs.audit.result == 'success'
      && needs.zkp-pin.result == 'success'
    needs:
      [
        public-api,
        audit,
        test,
        lint,
        docs,
        ubuntu,
        macos,
        windows,
        submodule-pin-release,
        zkp-pin,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/btclib-secp256k1/
    permissions:
      id-token: write # required by Trusted Publishing to request the OIDC token

    steps:
      - name: Download the wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-wheels-*"
          merge-multiple: true
          path: dist

      - name: Download the source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist

      - name: Show distributions
        run: ls -l dist

      # generates PEP 740 attestations by default
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    # see publish-testpypi for the repository condition, and for the `always()`:
    # public-api is a need for the ordering and not for its result on a tag
    # exactly as on a rehearsal; submodule-pin-release is checked for its result
    # there for the same reason as on that job, and zkp-pin-tag here alone,
    # being release-only
    if: >-
      always() && github.event_name == 'push'
      && github.repository == 'btclib-org/btclib-secp256k1'
      && needs.test.result == 'success' && needs.lint.result == 'success'
      && needs.docs.result == 'success' && needs.ubuntu.result == 'success'
      && needs.macos.result == 'success' && needs.windows.result == 'success'
      && needs.submodule-pin-release.result == 'success'
      && needs.audit.result == 'success'
      && needs.zkp-pin-tag.result == 'success'
      && needs.zkp-pin.result == 'success'
    needs:
      [
        public-api,
        audit,
        test,
        lint,
        docs,
        ubuntu,
        macos,
        windows,
        submodule-pin-release,
        zkp-pin-tag,
        zkp-pin,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/btclib-secp256k1/
    permissions:
      id-token: write # required by Trusted Publishing to request the OIDC token

    steps:
      - name: Download the wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-wheels-*"
          merge-multiple: true
          path: dist

      - name: Download the source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist

      - name: Show distributions
        run: ls -l dist

      # generates PEP 740 attestations by default
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # only after PyPI has accepted the upload: a GitHub release announces
  # what can already be installed, and the download url in pyproject.toml
  # points at the page this creates.
  # Both jobs above in `needs`, and not build alone: build runs in a
  # rehearsal too, so naming it by itself would make this job cut a
  # release from a dispatch, where publish-pypi is skipped and a skipped
  # need is what keeps this to the tag. build earns its place in the list
  # by producing the bundle attached here.
  # `always()` is required here too. A job is skipped whatever its own
  # condition asks where a job anywhere in its ancestry was skipped or
  # failed, unless that condition starts with a status function, and
  # public-api, a need of publish-pypi, fails by design on a break
  # RELEASE_NOTES.md does not name. v0.8.0 to v0.8.0.2 published and cut
  # no GitHub release for want of it. RELEASING.md has that record, and the
  # release by hand that recovers a skip, which `gh run rerun --failed`
  # does not reach.
  # The checkout, the downloads and the release creation are
  # btclib-org/.github's: reusable-github-release.yml, called at @main so
  # a fix there reaches this tree in one landing (section 10 of its
  # README.md). dist-artifact is sdist, the same value build above takes
  # and for the same reason (issue btclib-org/.github#35)
  github-release:
    needs: [publish-pypi, build]
    if: >-
      always() && needs.publish-pypi.result == 'success' &&
      needs.build.result == 'success'
    # a called workflow's own permissions: block can only downgrade, not
    # restore, what this calling job grants, so every scope the callee's
    # job asks for is named here too, or the run fails before any job
    # starts (a startup_failure, measured in btclib-org/.github#912)
    permissions:
      contents: write # the one job that writes to the repository through its token
    uses: btclib-org/.github/.github/workflows/reusable-github-release.yml@main
    with:
      dist-artifact: sdist

  # the sentinel on what users can install, run at the one moment its answer
  # changes -- and a call rather than a workflow_run trigger, which zizmor
  # rates dangerous and rightly: that one runs the default branch's copy of a
  # workflow with a token nobody reviewed, where a call runs inside the
  # release that gated it, in its graph and in its log.
  # It waits for the index to serve the version this tag names before
  # installing anything, so it cannot pass by testing the release before this
  # one, and it runs beside github-release rather than before it: a release
  # announcing files that do not install is worse than a release announced a
  # few minutes later, but the announcement is not what makes them
  # installable
  published:
    name: Install the published version from PyPI
    needs: publish-pypi
    # publish-pypi's own `always()` opts it back in past public-api's
    # designed failure and does not carry this job with it: a bare
    # `needs` here still reads back through publish-pypi's own `needs`,
    # and public-api two hops away skips this job although the one
    # dependency it lists succeeded. The same shape github-release's
    # comment above measured on v0.8.0.2
    if: always() && needs.publish-pypi.result == 'success'
    uses: ./.github/workflows/pypi-install.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ github.ref_name }}

  # the sentinel on the documentation, which nothing else watches: read
  # the docs activates and builds a new release tag from an automation
  # rule of its own, and a build that never starts fails nothing -- a
  # site answering 200 serves the last build that succeeded, for as long
  # as that takes somebody to notice. That rule is a dashboard action
  # rather than anything a pull request reaches, and btclib-org/.github#26
  # carries it; .readthedocs.yaml says what that leaves this repository
  # unable to declare for itself.
  # Release-only, a rehearsal never being tagged; after version-check, so
  # a tag it refuses produces one verdict and not two; and nothing needs
  # it: a late documentation build is not a reason to withhold a wheel,
  # and the fix for a red run here is a build on their side, never a
  # moved tag.
  #
  # The checkout, the wait script and its test are all
  # btclib-org/.github's: reusable-documented.yml, called at @main so a
  # fix there reaches this tree in one landing (section 10 of its
  # README.md). readthedocs-slug is the one input the family has no
  # default for, and it equals this repository's own name only by
  # coincidence (btclib-org/.github#35)
  documented:
    needs: version-check
    if: github.event_name == 'push'
    uses: btclib-org/.github/.github/workflows/reusable-documented.yml@main
    with:
      readthedocs-slug: btclib-secp256k1
