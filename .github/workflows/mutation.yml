---
name: mutation

# Coverage answers "was this line executed"; this answers "would the suite
# notice if it were wrong". The ratchet in pyproject.toml is at 100% with no
# slack, so the first question is settled here and the second was never
# asked.
#
# The shape of this package is why it is worth asking. What is hand-written
# is a boundary -- `if len(x) != 32: raise`, a scalar checked against the
# group order, a return code compared with zero -- and that is exactly the
# shape where a mutant survives a fully covered tree: change 32 to 31 and
# the line still runs. What kills it is a test at 31 octets *and* one at 33,
# and whether every bound has both is what nobody has measured.
#
# What it cannot ask is the other half of that same boundary, and a green
# session does not say otherwise. The operators replace arithmetic,
# comparisons, literals, branches and decorators; not one of them puts a
# different expression in an argument list, so *which argument a `lib` call
# is handed* -- the whole of what a binding decides -- is mutated by
# nothing here. core/VariableReplacer and core/VariableInserter are the two
# that come closest and neither file of .github/mutation instantiates
# them: both declare cause_variable and effect_variable arguments neither
# supplies, and configured they would substitute a random number, which
# cffi refuses where a pointer was declared -- a mutant dying because
# the boundary type-checks, not because a test read what the call wrote.
# So an out-parameter's semantics rest on a test that exercises both of its
# answers, and writing that test is not something these sessions will prompt.
# The first revision of #220 is the instance: `ffi.NULL` in place of the
# `int *` a caller allocated left the suite passing, an even-y key and a
# zeroed allocation agreeing on 0 on every side of every comparison.
#
# The baseline check, the session loop, the restore guard, the counts and
# the upload are btclib-org/.github's reusable-mutation.yml, called at
# @main so a fix there reaches this tree in one landing (section 10 of
# that repository's README.md, btclib-org/.github#35). What stays here is
# this tree's own subject matter -- the two scopes
# .github/mutation/bindings.toml and .github/mutation/zkp.toml state, the
# budget of each and the job's ceiling -- and the trigger, the schedule, the
# concurrency group and the permissions, none of which a reader of the
# callee could write for this tree.
#
# It gates nothing, and that is the design rather than a caution. A gate
# needs a number nobody has yet, and a survival rate is not a regression: a
# mutant survives because a test is missing, so a red merge would block
# whoever next touched a file for a hole somebody else left. It therefore
# does not appear in main's required checks, and must not -- that rule
# lives outside the repository and names its checks as literal strings. See
# REPOSITORY.md.
#
# What runs here is what those two files say, which is what CONTRIBUTING.md
# documents for a local run: one statement of each scope and its test
# command, not a second copy of them in yaml.

on:
  schedule:
    # Monday, and the grid gives the hour to this alone: sessions
    # measured in minutes get an hour nothing else asks for. What it
    # asks is on a different axis from every other sentinel here -- the
    # suite's own quality, not a dependency's or a platform's.
    # The time is the organization grid -- section 10 of
    # btclib-org/.github's README.md -- and not this file's to restate.
    # Cron runs from the default branch only, so this file does nothing
    # until it reaches main -- on any other branch it is reachable through
    # the dispatch below and nowhere else
    - cron: "8 5 * * 1"
  # the escape hatch, and the way to re-measure after writing the tests a
  # survivor asked for
  workflow_dispatch:
  # no pull_request trigger, unlike links.yml, which does run itself when
  # its own configuration changes. The difference is what the two cost: a
  # link sweep is a few hundred requests, and a session is one run of the
  # suite per mutant. check-toml parses these configurations on every
  # commit, and `cosmic-ray baseline`, which the callee runs first for each,
  # fails the run before any mutant if a test command has gone stale, which
  # is what that trigger would have caught

# least privilege for the GITHUB_TOKEN: everything running in a job can read
# it, and nothing here writes. In particular no issues: write -- an
# automatic issue per surviving mutant is the usual next step, declined to
# save a maintainer from reading a report they already receive
permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # one profile of two sessions, the whole suite's over the package less
  # `zkp` and then `zkp`'s own, in the order the `sessions` string lists
  # them. They are sessions of one profile and not two profiles because they
  # share one build and one working tree: a session mutates the tree in
  # place, so the sessions run one after the other, and a second profile
  # would run in a job of its own, with a second build. `extra-env` is an
  # input of the whole workflow and not of a profile, so a second profile
  # would build with it too.
  #
  # Each session's budget is the longest that session took in a run that
  # reached every mutant, with a margin over it for a slower runner, and a
  # session cut at its budget says `never run` in its summary line. The
  # first session runs the whole suite, so its length follows the suite's,
  # and a change that adds tests is one to dispatch this workflow after.
  # The job's step timings give the sum of the two --
  # `gh api repos/btclib-org/btclib-secp256k1/actions/runs/<id>/jobs` --
  # and the times of the `.sqlite` files in the artifact's zip, `unzip -l`,
  # give where the first ends. The ceiling is both budgets and the time the
  # job spends outside the sessions: the checkout, the environment, the
  # baselines and the steps after them.
  #
  # `extra-env` carries the variable, which has to be `true`:
  # scripts/cffi_build.py compares it with that string, so `1` builds no
  # extension and the sessions run on, against tests that skip, without
  # saying so.
  mutation:
    uses: btclib-org/.github/.github/workflows/reusable-mutation.yml@main
    with:
      profiles: >-
        [{"profile": "the bindings", "slug": "bindings", "ceiling": 150,
        "sessions": "bindings.toml 120m\nzkp.toml 20m"}]
      submodules: true
      extra-env: BTCLIB_LIBSECP256K1_ZKP=true
