---
name: api-break

# The `api-break` label on a pull request that breaks the public API
# (btclib-org/.github#1674). The walk, the comparison and the label are
# btclib-org/.github's reusable-api-break.yml, called at a tagged commit
# (section 10 of btclib-org/.github's README.md). What stays here is the
# trigger, the concurrency group, the permissions and this header, none of which
# the callee holds. `package` is the one input the callee has no default for,
# the same value release.yml passes to reusable-public-api.yml.
#
# Advisory: the job gates nothing, and it is not a required check.

on:
  pull_request:
    # the types claude-review.yml and links.yml give, for their reasons:
    # ready_for_review so a pull request marked ready gets the run the
    # callee withheld while it was a draft, closed so a close without a
    # merge lands in the pull request's own concurrency group and
    # supersedes a run nobody will read. A merge does not cancel the run
    # in flight, for the reasons the concurrency group below gives. The
    # callee declines a closed event itself.
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # the way to run it on a branch with no pull request. The callee runs
  # its job on a pull_request event alone, so a dispatch only shows the
  # caller is well formed
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN, elevated on the calling job below
permissions:
  contents: read

# named literally rather than through github.workflow, as everywhere else
# here, and keyed on the pull request's own number so the closed event
# lands in the group of the run it supersedes. A merged pull request's
# closed run does not cancel the run in flight, for the reasons links.yml
# gives beside its own group: nothing here runs on the commit a merge
# creates, and the run in flight is what sets the label
concurrency:
  group: api-break-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event.action == 'closed' && github.event.pull_request.merged) }}

jobs:
  # `pull-requests: write` is what setting the label takes, and
  # `contents: read` what the checkout takes: a called workflow's own
  # `permissions:` can only downgrade what its caller grants. The callee's
  # job declines a draft and a closed pull request itself, so this job
  # carries no `if:`
  api-break:
    permissions:
      contents: read
      pull-requests: write # the label; read-only on a fork
    uses: btclib-org/.github/.github/workflows/reusable-api-break.yml@0f5684ab3d7bf310b0d7a2e4dd91a03522f75d67 # v2026.10.25
    with:
      package: btclib_secp256k1
