---
name: links

# the documentation of this package is mostly links: the BIPs a wrapper
# implements, the upstream functions it calls, the packaging specifications
# the release follows. The globs below are which markdown that is, and
# lychee's own summary is how many URLs it holds; nothing here looked at
# one of them before this workflow.
#
# Not a pull request gate, and that is the design rather than a caution. A
# link rots without anybody touching the repository, so checking it per
# commit reports the internet's weather on somebody else's branch; and a
# third party answering 502 or throttling a runner would turn a red merge
# into something to re-run rather than something to fix. Weekly, on demand,
# and red in the Actions tab is where this belongs -- the same division
# pypi-install.yml already makes for what PyPI serves.
# It therefore does not appear in main's required checks, and must not:
# that rule lives outside the repository and names its checks as literal
# strings. See REPOSITORY.md.

on:
  schedule:
    # Saturday, the day the grid gives to a tree's own health: this asks
    # whether the URLs it points at are still where they were.
    # The time is the organization grid -- section 10 of
    # btclib-org/.github's README.md -- which gives a workflow its day
    # and its hour and this repository its minute, and is not this
    # file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "8 4 * * 6"
  # the escape hatch, and the way to check a branch before merging a
  # change that adds links
  workflow_dispatch:
  # so a change to this file, or to the ignore list beside it, is checked
  # by the thing it configures. The filter is evaluated against the pull
  # request's whole diff against its base rather than against the push that
  # triggered the run, so once a pull request touches either file every
  # later push to that branch runs this too: harmless, being a few hundred
  # requests that gate nothing
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all.
    # closed joins them for a different reason: merging or closing a pull
    # request is neither a push nor a synchronize, so a run still held in
    # this pull request's own concurrency group survives it unless the
    # closed event's own run also lands there. The concurrency block
    # below is what decides whether that landing cancels it or only
    # queues behind it (#523) -- this trigger only supplies the event the
    # two cases are told apart by. "This pull request's
    # own group" is the part github.ref alone gets wrong: for a closed,
    # merged pull request it resolves to the base branch's ref, which
    # this workflow has no push trigger to collide with, but the weekly
    # schedule and a workflow_dispatch both also run on the default
    # branch and would resolve to that same ref. The concurrency block
    # below groups by the pull request's own number instead, immune to
    # that under any action
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - .github/workflows/links.yml
      - .lycheeignore

# least privilege for the GITHUB_TOKEN: everything running in a job can
# read it, and nothing here writes. lychee is given it for github.com
# links alone, where an unauthenticated runner is rate limited hard enough
# to look like rot.
# Deliberately not issues: write. An automatic "link rot" issue is the
# usual next step, and it would make this the only workflow here able to
# write anything -- to save a maintainer from reading a failure
# notification they already receive
permissions:
  contents: read

# cancel superseded runs. Named literally rather than through
# github.workflow, as everywhere else here: in a called workflow what that
# expression resolves to is undocumented.
# github.event.pull_request.number, not github.ref alone, is what a
# pull_request run of any action groups by -- the pull_request trigger's
# own comment above has the reasoning. Neither schedule nor
# workflow_dispatch carries pull_request context, so github.ref is still
# what groups either, unchanged
concurrency:
  group: links-${{ github.event.pull_request.number || github.ref }}
  # true is right for a new push, and for a pull request closed without
  # merging: neither leaves anything worth finishing. A closed, merged
  # pull request is the one event it is wrong for, and what makes it so
  # is the absence of a push trigger above: nothing runs this on the
  # commit a merge creates, so the run in flight is the only reading the
  # merged change gets before the schedule comes round, and #523
  # measured what a cancel costs where that holds. So the expression is
  # false there and true everywhere else -- the closed, merged run still
  # lands in the group and queues behind whatever is running rather than
  # cancelling it
  cancel-in-progress: ${{ !(github.event.action == 'closed' && github.event.pull_request.merged) }}

jobs:
  links:
    name: Check the documentation links
    # a draft pull request is work in progress and spends no runner
    # here either: the same condition lint.yml and test.yml carry, and
    # ready_for_review is a trigger type above for the same reason.
    # A closed pull request spends none either, merged or not -- the
    # concurrency block above is what stops a merged one's own run from
    # cancelling the run this condition already let finish (#523)
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # a few hundred requests with retries; a job past this is hung on one
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # no `submodules:`, which is what keeps the vendored tree out of
          # this sweep without an exclusion: secp256k1/ is not checked out
          # at all here, and its own CHANGELOG and CONTRIBUTING carry links
          # that are upstream's to maintain. Measured before writing this:
          # every URL that did not answer cleanly was inside that submodule

      - name: Check the links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # the prose, and named by path rather than as `**/*.md`, so that
          # adding `submodules: true` above could not silently widen the
          # sweep to upstream's documentation. Narrower than btclib's and
          # bitcoin-core-rpc's own globs, which reach docs/ and tests/,
          # and not by omission: what those two would add carries no
          # external URL, which `grep -rl http --include='*.md' docs
          # tests` is what says rather than a claim here about what
          # those pages are.
          # The retries and the timeout are what keep a slow or throttling
          # host from being reported as a dead one, and the measurement
          # behind them is this repository's own: a URL here answered 418
          # to the first request and 200 to the second, which is a bot-block
          # and not rot. 429 is accepted for the same reason -- a rate
          # limit is the runner's address being judged,
          # not the link. The accepted list replaces lychee's default
          # rather than adding to it, so the default -- `100..=103,200..=299`,
          # what `lychee --help` prints for the flag -- is spelled out
          # before the 429: a list naming 200 alone turns a 204 to a HEAD,
          # or a redirect ending in a 201, into a dead link without anybody
          # touching the tree.
          # No cache flag: a run starts from a fresh workspace and no step
          # restores the file lychee would write, so it decided nothing
          # between runs, and within one lychee already requests each
          # unique URL once.
          # --include-fragments, or a heading renamed in the tree a link
          # here points into breaks that link with nothing red anywhere:
          # the forge serves the page and drops a fragment it cannot
          # resolve, so the run that notices is the linking tree's. The
          # check reads the page already fetched for the link, so it adds
          # no request. What can override it is the token below: on a
          # failed github.com/<owner>/<repo> link lychee falls back to the
          # repositories API, so a missing fragment on that shape -- how
          # CONTRIBUTING.md and REPOSITORY.md cite the standard -- is
          # read, found missing, and then answered OK because the
          # repository exists; the blob/main/README.md form REPOSITORY.md
          # also carries names a path the API declines and stays red.
          # btclib-org/.github#630 is where that is weighed.
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --timeout 45
            --accept 100..=103,200..=299,429
            --include-fragments
            "*.md" "scripts/*.md" ".github/*.md"
          # fail the job rather than only summarizing: a green run that
          # found dead links is the state this workflow exists to end
          fail: true
        env:
          # for github.com links only, per the permissions comment above
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
