---
name: zkp pin

# Is the secp256k1-zkp commit this tree pins close to upstream's master,
# and signed by a recognized signer? GitHub serves any commit of a fork
# network through any member's URL, so a gitlink moved to a commit of an
# unrelated fork resolves, and no required check refuses it
# (issue #1086).
#
# Two callers, which is why this is a workflow of its own:
# vendored-vectors.yml runs it on a schedule and on a pull request, as a
# sentinel, and release.yml runs it as a job the publish jobs need.
# vendored-vectors.yml's `check` job holds issues: write, which a job
# called from release.yml must not be granted. workflow_dispatch is what
# RELEASING.md's tag step uses to ask the same question of main before
# the fork is tagged

on:
  workflow_call:
    inputs:
      concurrency-suffix:
        description: >
          Appended to the concurrency group, and the release workflow is
          the only caller that passes one. See the group below.
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

# never cancel: a run is a verdict on a commit, which a newer one does not
# supersede for a release waiting on it. github.ref in a called workflow is
# the caller's ref, so the suffix keeps release.yml's call out of the group
# of a sentinel run on the same ref: see lint.yml
concurrency:
  group: zkp-pin-${{ github.ref }}${{ inputs.concurrency-suffix }}
  cancel-in-progress: false

jobs:
  # The zkp pin's own external anchor (issue #613), the same shape as the
  # `pin` job of vendored-vectors.yml and a sentinel there for the
  # identical reason -- a keyserver or a maintainer's own site being
  # unreachable is nothing a pull request introduced -- but a gate in
  # release.yml, where a red run withholds the upload and a rerun of the
  # failed job is the repair. It answers a narrower question than `pin`,
  # argued in full on the issue:
  #
  # secp256k1-zkp cuts no tags (issue #604's own premise), so there is no
  # signed release act to verify the way `git tag -v` verifies one in `pin`.
  # What is checkable is who wrote the pinned commit, which is a weaker
  # claim than "the project blessed this as a release" and is worded as
  # one below rather than borrowing the pin job's own wording.
  #
  # Neither secp256k1-zkp's own SECURITY.md nor mainline's is the right
  # fingerprint source: both list the disclosure contacts for
  # vulnerabilities in mainline (Pieter Wuille, Tim Ruffing, and -- only
  # in mainline's own, more current copy -- Sebastian Falbesoner), and
  # neither names Andrew Poelstra or the maintainer of this repository.
  #
  # Since #828 the submodule points at `fametrano/secp256k1-zkp` rather
  # than at `BlockstreamResearch/secp256k1-zkp` directly (#841 tracks
  # re-pointing it back once BlockstreamResearch/secp256k1-zkp#373
  # merges), and the pin is a commit the maintainer authored and signed
  # with his own key. A single recognized-signer check cannot tell that
  # apart from self-attestation: one of the two fingerprints it would
  # hold is the same person who wrote the pin, so passing proves nothing
  # a reader does not already know (issue #855). What still carries
  # weight while the submodule points at the fork is narrower and
  # checkable: that the pin's delta against
  # `BlockstreamResearch/secp256k1-zkp`'s own master is small enough to
  # be the one commit README.md documents as under review there (#373),
  # and that every commit in that delta -- not only the commit a re-pin
  # happens to have named -- carries a valid signature from a fingerprint
  # this job holds. Where the delta is empty, which is what #841's
  # re-point produces, there is nothing beyond upstream to hold a
  # fork-only re-pin accountable for, and the second half alone decides
  # it: the pinned commit's own signature, checked directly rather than
  # as a one-item delta -- the same check this job ran before #855.
  #
  # Andrew Poelstra's fingerprint is recorded below because he personally
  # authored *and* signed the commit this delta held before #828
  # re-pointed the submodule at the fork -- sufficient reason to trust
  # his key for verifying that commit, and the whole of the claim --
  # sourced the way this job's own comment already asks a human to
  # source one, cross-referenced against a page only its owner controls,
  # `andrew.gpg` linked from his own GitHub profile bio (`gh api
  # users/apoelstra --jq .blog`), and checked against a second,
  # independent copy, GitHub's own key store for the same account
  # (`gh api users/apoelstra/gpg_keys`); the two agree.
  #
  # The maintainer's fingerprint is recorded for the opposite reason:
  # #828's re-pin is his own, signed with his own key, so holding it is
  # what lets this job pass on today's pin at all. Measured: unlike
  # Poelstra's, it has no independent second source to cross-reference
  # against -- keys.openpgp.org holds nothing for it at all (a fresh
  # keyring's `gpg --recv-keys` answers "No data", not a stripped key the
  # way Poelstra's does there), and the maintainer publishes no
  # standalone key file the way `andrew.gpg` is. `https://github.com/
  # fametrano.gpg` -- GitHub's own rendering of the account's key store,
  # the same data `gh api users/fametrano/gpg_keys` serves as JSON -- is
  # the only copy found, so this fingerprint is sourced from GitHub alone
  # rather than cross-referenced against a second, independent site, the
  # way every other fingerprint in this file is.
  #
  # What this means for the next re-pin: FINGERPRINTS below is not a
  # standing maintainer roster, only a record of who is trusted to sign
  # today's delta. A re-pin whose delta is authored or signed by anyone
  # else fails this job until that pull request adds their fingerprint
  # the same way, sourced and cross-referenced independently rather than
  # copied from either SECURITY.md. A re-pin whose delta against
  # BlockstreamResearch/secp256k1-zkp's master grows past what
  # EXPECTED_DELTA below allows fails it too, until that pull request
  # raises the value and says why the larger delta is still one
  # reviewable unit. That is a cost of every re-pin, stated here so it is
  # not rediscovered as a surprise red run.
  zkp-pin:
    name: Check the pinned secp256k1-zkp commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # shallow at this step: the delta step below needs the pin's
          # own ancestry, which it gets by unshallowing the submodule
          # itself rather than by widening this checkout
          submodules: true

      # Not keys.openpgp.org, which `vendored-vectors.yml`'s `pin` job fetches from: that
      # server publishes a key's user IDs only where its owner has
      # confirmed an address through it, and serves this one stripped of
      # them. GnuPG skips a key carrying no user ID on import and exits 0
      # having imported nothing, so a --recv-keys of this fingerprint
      # there reports success over an empty keyring. The bundle Andrew
      # Poelstra publishes carries the user IDs, and is the copy the
      # block comment above cross-references this fingerprint against.
      #
      # The source is a convenience and the assertion is the guard: this
      # step imports whatever that URL serves, and `gpg --list-keys` is
      # what establishes that the keyring now holds FINGERPRINT, which is
      # what the job trusts. It exits non-zero on a fingerprint the
      # keyring does not hold, so an import that brings nothing in fails
      # at the step that asked for the key rather than at the
      # verification step below, where an absent key reads as a bad pin
      # (issue #690)
      - name: Import the secp256k1-zkp signer's key
        env:
          # Andrew Poelstra
          FINGERPRINT: 90F9CA3C3EC97BE922DF955EC588D63CE41B97C1
          KEY_URL: https://www.wpsoftware.net/andrew/andrew.gpg
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/secp256k1-zkp-signer.gpg" "$KEY_URL"
          gpg --import "$RUNNER_TEMP/secp256k1-zkp-signer.gpg"
          if ! gpg --list-keys "$FINGERPRINT"; then
            echo "::error::$KEY_URL serves no key $FINGERPRINT"
            exit 1
          fi

      # keys.openpgp.org holds nothing at all for this fingerprint, and
      # the maintainer publishes no standalone key file the way the step
      # above imports Poelstra's from -- the block comment above has the
      # measurement. `https://github.com/<user>.gpg` is GitHub's own
      # rendering of the account's key store and the only copy this job
      # has to import from
      - name: Import the maintainer's key
        env:
          # Ferdinando M. Ametrano
          FINGERPRINT: B11512040C6E86D7B5E03DD14D71ED3A9A8EDFC5
          KEY_URL: https://github.com/fametrano.gpg
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/maintainer-signer.gpg" "$KEY_URL"
          gpg --import "$RUNNER_TEMP/maintainer-signer.gpg"
          if ! gpg --list-keys "$FINGERPRINT"; then
            echo "::error::$KEY_URL serves no key $FINGERPRINT"
            exit 1
          fi

      - name: The pin is the commit README.md names
        id: pin
        run: |
          named=$(sed -n 's|.*secp256k1-zkp/commit/\([0-9a-f]\{40\}\).*|\1|p' README.md | head -1)
          pinned=$(git ls-tree HEAD secp256k1-zkp | awk '{print $3}')
          if [ -z "$named" ]; then
            echo "::error::README.md links to no secp256k1-zkp commit"
            exit 1
          fi
          if [ "$named" != "$pinned" ]; then
            echo "::error::the submodule is pinned to $pinned, which README.md does not name"
            exit 1
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"

      # `rev-list --count` needs the pin's own parents, which the shallow
      # checkout above does not carry -- a shallow commit is grafted with
      # no parents at all, so `upstream..pinned` would answer 1 no matter
      # what the pin actually descends from, passing this step on a pin
      # with no relationship to upstream whatsoever. Measured against
      # today's own pin: the shallow, grafted count and the unshallowed
      # one happen to agree here, both answering 1 -- which is exactly
      # why the agreement proves nothing; a shallow grafted commit answers
      # 1 regardless of what it actually descends from, so only the
      # unshallowed count is evidence. `--unshallow` is asked of `origin`,
      # the submodule's own remote, because that is the remote the
      # shallow boundary was drawn against
      - name: The pin's delta against upstream's master is what README.md documents
        id: delta
        env:
          UPSTREAM_URL: https://github.com/BlockstreamResearch/secp256k1-zkp.git
          PINNED: ${{ steps.pin.outputs.pinned }}
          # the delta a re-pin may carry beyond upstream's master, in
          # commits -- see the block comment above for what raising this
          # costs
          EXPECTED_DELTA: 1
        run: |
          git -C secp256k1-zkp fetch --unshallow origin "$PINNED"
          git -C secp256k1-zkp fetch --force "$UPSTREAM_URL" \
            master:refs/remotes/upstream/master
          delta=$(git -C secp256k1-zkp rev-list --count \
            refs/remotes/upstream/master.."$PINNED")
          echo "$PINNED is $delta commit(s) ahead of upstream's master"
          if [ "$delta" -gt "$EXPECTED_DELTA" ]; then
            echo "::error::the pin is $delta commits ahead of" \
              "BlockstreamResearch/secp256k1-zkp's master, more than" \
              "README.md documents as reviewed -- see #828 and #841"
            exit 1
          fi
          echo "delta=$delta" >> "$GITHUB_OUTPUT"

      # `git verify-commit --raw` over its own exit code, because that
      # exit code answers a stricter question than this one is: GnuPG
      # fails a signature made with a key whose stated expiry has since
      # passed exactly the same way it fails a forged one, and Poelstra's
      # key has already been measured to be in that state -- expired
      # 2026-07-28, before the commit this delta held pre-#828 was signed
      # on 2026-09-05, weeks *after* that date, on both the copy that key
      # was imported from and GitHub's own independent copy of it. That
      # is Andrew Poelstra's own key hygiene lapsing, not a reason to
      # doubt he wrote the commit: nothing about an expired-but-not-
      # revoked key weakens the cryptographic fact that a signature was
      # produced by the private half of the fingerprint that made it,
      # which is the claim this job exists to check. So the
      # machine-readable status codes are read directly -- VALIDSIG
      # naming a recognized fingerprint is what a mathematically genuine
      # signature always prints, expired or not, and REVKEYSIG is the
      # one status that does mean stop trusting it, the owner's own act
      # rather than a calendar date
      #
      # Which status is printed instead of VALIDSIG decides what the
      # error says. NO_PUBKEY names a key id the keyring has nothing to
      # check the signature against, and past the two import steps above
      # that is some key other than the two FINGERPRINTS holds -- the
      # shape #855 was filed about, a re-pin signed by somebody this job
      # carries no fingerprint for. BADSIG is a signature that does not
      # verify against a key the keyring does hold (issue #690)
      - name: The pin's delta against upstream is signed by a recognized signer
        env:
          # Andrew Poelstra, Ferdinando M. Ametrano
          FINGERPRINTS: >-
            90F9CA3C3EC97BE922DF955EC588D63CE41B97C1
            B11512040C6E86D7B5E03DD14D71ED3A9A8EDFC5
          PINNED: ${{ steps.pin.outputs.pinned }}
          DELTA: ${{ steps.delta.outputs.delta }}
        run: |
          read -ra fingerprints <<< "$FINGERPRINTS"
          if [ "$DELTA" -eq 0 ]; then
            subjects="$PINNED"
          else
            subjects=$(git -C secp256k1-zkp rev-list \
              refs/remotes/upstream/master.."$PINNED")
          fi
          for commit in $subjects; do
            raw=$(git -C secp256k1-zkp verify-commit --raw "$commit" 2>&1) || true
            matched=""
            for fingerprint in "${fingerprints[@]}"; do
              if grep -q "^\[GNUPG:\] VALIDSIG $fingerprint " <<< "$raw"; then
                matched="$fingerprint"
                break
              fi
            done
            if [ -z "$matched" ]; then
              absent=$(sed -n 's|^\[GNUPG:\] NO_PUBKEY ||p' <<< "$raw" | head -1)
              if [ -n "$absent" ]; then
                echo "::error::$commit is signed by $absent, which this job" \
                  "holds no key for"
              elif grep -q "^\[GNUPG:\] BADSIG" <<< "$raw"; then
                echo "::error::$commit carries a signature that does not verify"
              else
                echo "::error::$commit carries no valid signature from a" \
                  "recognized fingerprint"
              fi
              echo "$raw"
              exit 1
            fi
            if grep -q "^\[GNUPG:\] REVKEYSIG" <<< "$raw"; then
              echo "::error::$matched has been revoked by its own owner"
              exit 1
            fi
            if grep -q "^\[GNUPG:\] EXPKEYSIG" <<< "$raw"; then
              echo "::warning::$matched has expired; the signature still" \
                "verifies and the key has not been revoked, so this passes" \
                "-- see issue #613"
            fi
            echo "$commit is validly signed by $matched"
          done
