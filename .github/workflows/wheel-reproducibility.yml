---
name: wheel-reproducibility

# btclib-org/btclib-secp256k1#439's stage 1: does a wheel this project
# builds reproduce byte for byte, on the platforms the release actually
# builds one on. #497 and #498 answered that for macOS by building twice
# in one checkout and diffing the two archives by hand; this runs the
# same measurement, through .github/scripts/check_wheel_reproducibility.py,
# on every platform build-cibuildwheel in test.yml builds a wheel on.
#
# It asks #439's stage 3 as well, which is #514: two builds in one job
# share an image, and the exemption in RELEASING.md and in section 12 of
# the organization standard rests on what happens across two of them --
# it names the compiler, its version and the toolchain the runner
# happened to have as inputs nothing pins. So every platform below
# carries a second image, chosen to differ in the toolchain it carries
# -- a different OS release for all but the Windows arm64 pair, whose
# two images share an OS build and differ in Visual Studio alone. Each
# job keeps the wheel it already built, and across-images downloads the
# pair and compares them. The second image costs a job and no extra
# build: the double build each one already does is what makes a
# difference between two images attributable to the image rather than to
# either build's own drift.
#
# And it asks #515, which is about what the release actually uploads.
# uv build, which rebuild runs, stops at the archive hatchling writes;
# cibuildwheel runs the same scripts/cffi_build.py and then repairs the
# wheel with the tool it defaults to on that platform -- auditwheel on
# Linux, delocate on macOS, delvewheel on Windows, [tool.cibuildwheel]
# naming no repair-wheel-command of its own. What that hands back is
# the repair's own file rather than the build's. The repaired job below
# builds through cibuildwheel twice and diffs the pair, so the file
# PyPI receives is the one under measurement.
#
# CIBW_BUILD narrows it to one interpreter, and the reason is not the
# one test.yml's build-cibuildwheel gives for narrowing a pull request:
# that one turns on the merge afterwards building everything, and
# nothing here ever does, the variable below being unconditional. The
# reason is that rebuild has only ever measured one interpreter -- uv
# build leaves one wheel, for the interpreter uv resolves for the
# project -- so an unnarrowed job here would answer a question this
# file asks nowhere else, at a cost that rises with every identifier
# cibuildwheel selects. What it leaves out is stated rather than
# covered: whether a wheel of another ABI tag reproduces is not
# measured, on any trigger.
#
# And no test command: what this asks is whether two archives are the
# same bytes, which running the wheel does not answer.
#
# On the release images alone, where rebuild carries two per platform:
# whether two images agree is the across-images question below, and it
# is already asked of the uv build wheel. Asking it again here would
# double this job for an answer the run already carries.
#
# The first image of each pair below is hand-kept against that job's own
# list, and repaired's own list is that same copy: GitHub Actions gives
# one workflow no way to read another's strategy.matrix short of
# workflow_call, which neither file uses and which wiring this sentinel
# into the gate would defeat the point of. A test holds the three
# together instead -- tests/wheel_reproducibility_platforms_test.py --
# so the files can still drift for a moment but not silently: the suite
# goes red the moment an image build-cibuildwheel builds on is missing
# from either job here, which is the direction that matters now that
# rebuild's list and that job's are no longer equal.
#
# It is a sentinel and not a gate. The property this asks about does not
# hold on every platform yet -- #439's own record of where the four
# stages stand says which do -- so a required check here would be one a
# pull request could never pass for a reason nothing on that pull request
# caused. Which platform is red is this workflow's own output, on the
# Actions tab, and not a list kept in this file: a list here would be a
# line every future fix has to edit, and nothing would fail when it was
# not edited.
#
# The pull_request trigger below is #508: schedule and workflow_dispatch
# alone made a fix unmeasurable before it landed, because both are inert
# off the default branch -- whoever writes #510's Windows fix has to see
# whether it worked before merging it. The paths filter is what keeps
# every other pull request from paying for a double build on every image:
# everything in it is something this job depends on -- the build scripts,
# the version and the build backend's own configuration, the vendored
# library this compiles, the script the last step runs, and this
# workflow's own matrix -- and nothing outside that list is.

on:
  schedule:
    # Sunday, hour 02: the day the grid gives to a tree's security, this
    # asking whether a wheel it builds reproduces byte for byte. The
    # time is the organization grid -- section 10 of
    # btclib-org/.github's README.md -- which gives a workflow its day
    # and its hour and this repository its minute, and is not this
    # file's to restate. Only the default branch schedules workflows, so
    # on any other branch this is reachable through the dispatch below
    # alone
    - cron: "8 2 * * 0"
  # the escape hatch, and the way to ask without waiting for the day
  workflow_dispatch:
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all.
    # closed joins them for a different reason: merging or closing a pull
    # request is neither a push nor a synchronize, so a run still held in
    # this pull request's own concurrency group survives it --
    # cancel-in-progress only fires when a new run lands in that group,
    # and nothing otherwise does. Landing the closed event there is what
    # lets it supersede the stale run instead of leaving it to finish on
    # a branch nobody is going to look at again. "This pull request's
    # own group" is the part github.ref alone gets wrong: for a closed,
    # merged pull request it resolves to the base branch's ref, which
    # this workflow has no push trigger to collide with, but the weekly
    # schedule and a workflow_dispatch both also run on the default
    # branch and would resolve to that same ref. The concurrency block
    # below groups by the pull request's own number instead, immune to
    # that under any action
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      # the build backend and the compiled extension's own sources
      - scripts/**
      # the version this builds and cibuildwheel's own configuration,
      # both read by the build
      - pyproject.toml
      # the vendored library this compiles twice: a gitlink is a path
      # like any other on a pull request, as vendored-vectors.yml's own
      # paths filter already relies on for the same submodule
      - secp256k1
      # the script the last step runs, on the same reasoning
      # vendored-vectors.yml's own paths filter gives for including its
      # own script: a change to it goes unmeasured on its own pull
      # request otherwise
      - .github/scripts/check_wheel_reproducibility.py
      # the matrix and the steps that decide what gets built and how
      - .github/workflows/wheel-reproducibility.yml

# least privilege for the GITHUB_TOKEN: everything running in a job can
# read it, and nothing here writes
permissions:
  contents: read

concurrency:
  # github.event.pull_request.number, not github.ref alone, is what a
  # pull_request run of any action groups by -- the pull_request
  # trigger's own comment above has the reasoning. Neither schedule nor
  # workflow_dispatch carries pull_request context, so github.ref is
  # still what groups either, unchanged
  group: wheel-reproducibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    name: Build the wheel twice on ${{ matrix.os }} and diff them
    # a draft pull request is work in progress and spends no runner
    # here either: the same condition lint.yml, test.yml and
    # vendored-vectors.yml carry, and ready_for_review is a trigger type
    # above for the same reason. A closed pull request spends none
    # either -- the trigger above takes the closed event only to let
    # cancel-in-progress supersede a run still holding in this ref's
    # group. A double build on every image of every platform is
    # expensive enough that this is not a convention followed for its
    # own sake here
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ${{ matrix.os }}
    # two full builds of the vendored library and the extension, from a
    # cache that is cold whenever the lock moved: well above what either
    # build needs, so what this bounds is a hung job rather than a slow
    # one
    timeout-minutes: 40
    strategy:
      # every image to the end: which platform disagrees is the whole
      # answer, and stopping at the first one hides the rest
      fail-fast: false
      matrix:
        # each platform build-cibuildwheel in test.yml builds a wheel
        # on, twice: on the image that job names, and on a second one
        # GitHub offers for the same platform and architecture. The
        # first of each pair is the copy of that job's own list, held
        # against it by tests/wheel_reproducibility_platforms_test.py --
        # see this file's own header for why it is a copy rather than a
        # read. The platform key is what pairs them for across-images
        # below, and what a wheel's own tag cannot do: a macOS runner's
        # deployment target reaches that tag, so two images of one
        # platform can name their wheels differently.
        # The second of each pair is a different OS release rather than
        # another label for the same one, that being what carries a
        # different compiler: 22.04 against 24.04 on both Ubuntu
        # architectures, macOS 15 against macOS 26 on both Apple ones,
        # Windows Server 2022 against 2025 on x64. The Windows arm64
        # pair is the one whose two images share an OS build and differ
        # in the Visual Studio they carry, which is the compiler on its
        # own with nothing else moving.
        include:
          - platform: linux-x86-64
            os: ubuntu-latest
          - platform: linux-x86-64
            os: ubuntu-22.04
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: linux-aarch64
            os: ubuntu-22.04-arm
          - platform: macos-x86-64
            os: macos-26-intel
          - platform: macos-x86-64
            os: macos-15-intel
          - platform: macos-arm64
            os: macos-latest
          - platform: macos-arm64
            os: macos-15
          - platform: windows-x86-64
            os: windows-latest
          - platform: windows-x86-64
            os: windows-2022
          - platform: windows-arm64
            os: windows-11-arm
          - platform: windows-arm64
            os: windows-11-vs2026-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the vendored library is compiled twice here
          submodules: recursive
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # no project dependency: the script imports only the standard
      # library and shells out to the very `uv` this step just installed.
      # shell: bash for the two Windows images, whose default is
      # PowerShell -- see os-windows.yml's own comment on the hazard a
      # POSIX-only step hits there unnoticed; this step is one plain
      # command and runs identically under either shell today
      - name: Build the wheel twice and diff the two archives
        shell: bash
        env:
          # one directory per platform and one per image inside it, which
          # is the shape --across-images reads once the artifacts are
          # merged back together; RUNNER_TEMP rather than the workspace
          # so that check-sdist's own question about untracked files is
          # never asked of a wheel
          KEEP_WHEEL: ${{ runner.temp }}/wheel/${{ matrix.platform }}/${{ matrix.os }}
        run: >
          uv run --no-project python
          .github/scripts/check_wheel_reproducibility.py
          --keep-wheel "$KEEP_WHEEL"

      # !cancelled(), not the default success(): the step above exits
      # non-zero when this one image's own two builds disagree, and the
      # wheel it saved before comparing them is still the half
      # across-images needs. A build that produced no wheel at all
      # uploads nothing and warns, which across-images reports as a
      # platform it could not compare rather than as one that agreed
      - name: Keep this image's wheel for the across-images comparison
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.platform }}-${{ matrix.os }}
          path: ${{ runner.temp }}/wheel/

  repaired:
    name: Build the repaired wheel twice on ${{ matrix.os }} and diff them
    # rebuild's own conditions, and for its own reasons
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ${{ matrix.os }}
    # two cibuildwheel builds, each of which provisions an interpreter
    # and, on Linux, pulls a container per libc before compiling
    # anything: the same bound-a-hung-job ceiling rebuild carries
    timeout-minutes: 40
    # the interpreter uv runs cibuildwheel with is the one setup-python
    # installs below and never one of uv's own: see build-cibuildwheel
    # in test.yml, whose own env carries this variable and the reason
    env:
      UV_PYTHON_DOWNLOADS: never
      # the one interpreter, and no test run: see this file's header
      CIBW_BUILD: cp314-*
      CIBW_TEST_SKIP: "*"
    strategy:
      # every image to the end, as in rebuild: which platform disagrees
      # is the answer
      fail-fast: false
      matrix:
        # build-cibuildwheel's own list in test.yml, copied, and held
        # against it by tests/wheel_reproducibility_platforms_test.py --
        # equality here, where rebuild's is a containment, since this
        # job carries no second image of a platform
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-26-intel
          - macos-latest
          - windows-latest
          - windows-11-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the vendored library is compiled twice here too
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # --only-group build, so the environment is cibuildwheel and the
      # tools it needs and no extension of this project's own; --locked,
      # so the cibuildwheel deciding the images and the identifiers is
      # the one uv.lock pins rather than whatever the index holds. The
      # script finds cibuildwheel on the PATH this sets, which is why it
      # runs under uv run rather than under --no-project as rebuild's
      # does. shell: bash for the two Windows images, whose default is
      # PowerShell -- see rebuild's own step for the hazard
      - name: Build the repaired wheel twice and diff the two archives
        shell: bash
        run: >
          uv run --locked --only-group build python
          .github/scripts/check_wheel_reproducibility.py
          --repaired

  across-images:
    name: Compare the wheels two images of one platform built
    needs: rebuild
    # !cancelled() rather than success(), for the same reason the upload
    # step above carries it: a platform whose images disagree is what
    # this job exists to name, and one image's red must not take the
    # comparison with it. The draft and closed conditions are rebuild's
    # own -- a skipped rebuild leaves nothing to download, and this job
    # would go red for the absence rather than for a difference
    if: >-
      ${{ !cancelled() && !github.event.pull_request.draft
      && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # a download and a member-by-member diff of archives already built:
    # nothing here compiles
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the script is all this job needs, and it compiles nothing:
          # the vendored library would be a submodule clone for nothing
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # merge-multiple, so every artifact lands in one tree: each holds
      # its own platform and image directories already, and the pair of
      # them under one platform is what the comparison is
      - name: Download every image's wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          merge-multiple: true
          path: ${{ runner.temp }}/wheels

      - name: Diff the wheels two images of one platform built
        env:
          WHEELS: ${{ runner.temp }}/wheels
        run: >
          uv run --no-project python
          .github/scripts/check_wheel_reproducibility.py
          --across-images "$WHEELS"
