---
name: claude-review

# Claude reading a pull request against REVIEWING.md, and answering a
# comment naming @claude. The checkout, the credential guard, the
# prompt, the review action, the verdict check and the mention job are
# all btclib-org/.github's reusable-claude-review.yml, called at @main
# so a fix there reaches this tree in one landing (issue
# btclib-org/.github#35). What stays here is the trigger, the
# concurrency group, the workflow-level permissions and this header,
# none of which the callee holds.
#
# It is one more job on every pull request, which is not free: the
# concurrency ceiling belongs to the organization and is shared, so this
# job competes for a slot with the other repositories' matrices.
# REPOSITORY.md's *Plan-gated settings* has the ceiling and the command
# that answers the plan setting it. It earns the slot by being short --
# it reads a diff, it does not build a matrix -- and by skipping a
# draft, which is the callee's own condition.

on:
  pull_request:
    # ready_for_review so a pull request marked ready gets the review the
    # draft condition in reusable-claude-review.yml withheld while it was
    # a draft: the default types do not include it, and without it a
    # readied pull request would wait for its next push to be reviewed at
    # all. The same reasoning links.yml carries for the same type.
    #
    # closed joins them for the reason every other pull_request workflow
    # here gives at this key: merging or closing a pull request is neither
    # a push nor a synchronize, so a review still held in that pull
    # request's concurrency group survives it -- cancel-in-progress only
    # fires when a new run lands in that group, and nothing otherwise
    # does. Landing the closed event there is what lets it supersede a
    # review nobody is going to read, which is a shared concurrency slot
    # and a model call the header above says are not free. The callee's
    # own `review` job declines the review itself on this event, a pull
    # request that has stopped taking changes being none to write a
    # verdict on.
    #
    # The group is at the workflow level (see concurrency: below), which
    # is what lets the closed run above enter it when the run is created
    # and before any job's own if is read -- the same mechanism docs.yml's
    # own comment records working, a closed run there having landed in
    # its group and cancelled the run building a merge commit's
    # documentation. Whether a job-level group ever claims it for a job
    # an if skips is the question btclib-org/btclib-secp256k1#593 left
    # open, deliberately: the workflow-level placement below is correct
    # under either answer to it, the group being keyed on the event and
    # the pull request number rather than on any job.
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # the on-demand half: somebody writes @claude in a comment on a pull
  # request, or on a line of its diff, and asks for something the automatic
  # pass did not answer
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# least privilege for the GITHUB_TOKEN, elevated on the calling job below
permissions:
  contents: read

# named literally rather than through github.workflow, as everywhere else
# here. Workflow-level rather than job-level, per
# btclib-org/btclib-secp256k1#593's decision: a workflow-level group is
# claimed when the run is created, before any job's if is read, which is
# the mechanism docs.yml's own comment records working for its own closed
# event, independently of whether GitHub gives a job an if skips its own
# concurrency group at all -- the question that issue closed without
# answering.
#
# One key has to serve pull_request (the review, and the closed event
# above) and issue_comment/pull_request_review_comment (the mention)
# without letting either land in the other's group: a
# pull_request_review_comment event carries
# github.event.pull_request.number too, so the number alone would put a
# mention answer in the review's own group and let either cancel the
# other. github.event_name tells them apart -- true only for a
# pull_request event. Every other event falls back to github.run_id,
# unique to that run: no two runs can ever share it, which is what a run
# with no matching group already gives. cancel-in-progress below is
# therefore inert for the mention, and one @claude answer still runs to
# completion alongside another rather than cancelling it.
concurrency:
  group: >-
    claude-review-${{ github.event_name == 'pull_request'
    && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # One calling job reaches both of the callee's jobs, and each declines
  # the events that are not its own, so this job carries no `if:` of the
  # review's: the switch, the draft check, the closed check and the fork
  # check are the callee's. Lifting the review's condition onto this job
  # would take the mention out with it.
  #
  # Neither input is passed: `extra-prompt` takes a paragraph a review of
  # this tree needs and a review of another tree does not, and
  # `extra-allowed-tools` a command beyond the callee's base set.
  #
  # Permissions are the calling job's to declare and not the callee's to
  # restore: a called workflow's own `permissions:` can only downgrade
  # what its caller granted. `contents: read` is what the checkout takes,
  # `pull-requests: write` is what posting the review or the reply takes,
  # and `id-token: write` is the OIDC token the action mints during its
  # own startup regardless of which Anthropic credential is in use --
  # btclib-org/.github#912 is where a caller omitting a scope a called
  # job declares was measured to end the run in `startup_failure` before
  # any step ran.
  #
  # secrets: named rather than `inherit`, the callee's own header
  # offering either: `inherit` hands the callee every secret this
  # repository holds, which is what zizmor's secrets-inherit audit
  # flags, and there is exactly one secret to pass.
  claude-review:
    permissions:
      contents: read
      pull-requests: write # posting the review, and the reply to a mention
      id-token: write # the OIDC token the action mints at its own startup
    uses: btclib-org/.github/.github/workflows/reusable-claude-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
