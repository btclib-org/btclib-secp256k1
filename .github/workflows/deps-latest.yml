---
name: deps-latest

# the dependency sentinel: everything uv resolves, upgraded to the newest
# release that satisfies pyproject.toml, and then put through the suite,
# the lint gate and the packaging checks.
#
# Nothing else covers this, and the gap is wider here than in a pure python
# package. Every uv command in every other workflow passes --locked, so
# what CI runs is the resolution somebody locked rather than the one PyPI
# holds today; the dependency groups declare no version at all, so the
# whole drift of pytest, mypy, twine and cibuildwheel lives in uv.lock. And
# the one runtime dependency is cffi, which this package does not merely
# import but *compiles against*: a cffi release that changes the extension
# ABI, or a setuptools or cmake release that changes how the vendored
# library is built, breaks the build itself and not a test. That has
# happened, and it was found by other means.
#
# uv.lock moves on a weekly dependabot pull request here -- Thursdays, the
# day the cron below runs one ahead of -- with a seven day cooldown in
# front of it, so without this workflow an upstream break can sit unseen
# for a fortnight and then arrive inside a diff of many entries, where its
# cause is one line among them.
#
# The obvious alternative -- dropping --locked from test.yml and resolving
# afresh every run -- is what this exists instead of: a pull request would
# go red for a release in somebody else's repository, and the contributor
# holding the branch can fix none of it. pytest runs with
# filterwarnings = ["error"] and coverage with a fail_under of 100, so the
# ways an upstream release turns this tree red without anybody touching it
# are not hypothetical. Determinism is what makes the gate legible; the
# early warning belongs on a schedule, off the critical path -- the same
# division pypi-install.yml makes for what PyPI serves.
#
# Scope: what uv resolves. Not the pre-commit hook revisions, which are
# pinned by rev in .pre-commit-config.yaml and moved by pre-commit.ci's
# weekly pull request, which runs the whole matrix. mypy is one of those
# and not an exception to it: its hook is `mirrors-mypy` at a pinned rev,
# and the packages it type-checks against are pinned by hand in
# `additional_dependencies`, which `uv lock --upgrade` does not write.
# That is the second of the two answers section 4 of the organization
# standard gives, and the right one for a package whose types rest on a
# handful of stubs rather than on itself. It is also why the lint job
# below reaches less here.
#
# What an upgrade writes and what it falsifies are two questions, and
# that hook's declarations are outside the first and inside the second:
# tests/hook_pins_test.py reads them against the lock, the rev against
# the mypy uv.lock resolves and each additional dependency against its
# own package there. So an upgrade moving one of those packages fails
# that module in the suite below, and the failure names a declaration in
# .pre-commit-config.yaml the lock has moved past -- the rev being
# pre-commit.ci's to move and the pins moved by hand, as the comment on
# them there says -- rather than anything about what uv resolves.
#
# Nothing here gates anything, by construction: a workflow of its own, no
# aggregate job, named by no branch protection rule (see REPOSITORY.md).
# That is the point. This is expected to go red for reasons no pull request
# introduced, and a red check nobody can act on from a branch is noise. It
# opens no issue either: a failed scheduled run notifies the last person to
# have touched the cron below, and that is the signal.

on:
  schedule:
    # Wednesday, the day before Dependabot's, which is the whole of the
    # placement: this reports on the upgrade before the pull request
    # carrying it opens. pypi-install.yml follows an hour later, the pair
    # asking what moved underneath -- the dependencies here, and what the
    # index serves there.
    # The time is the organization grid -- section 10 of
    # btclib-org/.github's README.md -- and not this file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "8 4 * * 3"
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies, build scripts) can read it, so it must not be
# able to write to the repository
permissions:
  contents: read

# named literally rather than through github.workflow: nothing calls this
# workflow today, but that expression is the caller's name when something
# does, and the convention is what keeps the groups distinct
concurrency:
  group: deps-latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # the checkout, the uv setup, the runner-image step, the hook cache,
  # the upgrade and the suite and lint runs over it are
  # btclib-org/.github's: reusable-deps-latest.yml, called at @main so a
  # fix there reaches this tree in one landing (issue
  # btclib-org/.github#35). What stays here is the trigger, the
  # concurrency group, the workflow-level permissions, this job's own
  # id, coverage-latest and dist-latest below, and the facts the called
  # workflow asks a caller for rather than states itself: the matrix.
  #
  # submodules feeds both of the callee's jobs: the extension is built
  # from the vendored library in both, which is why this tree's own
  # suite-latest and lint-latest each set it themselves before the
  # call; fetch-depth: 0 is the lint job's alone, for the same hook
  # resolving a release name in the vendored clone's own refs that
  # lint-latest named there.
  #
  # --no-cov replaces this job's own suite running
  # --cov-fail-under=0, and the two are not two spellings of one thing:
  # --cov-fail-under=0 kept the report and gave up only the floor,
  # --no-cov drops the measurement outright. It costs nothing here --
  # coverage-latest below, unchanged by this conversion, is the job
  # that combines the union of the static, dynamic and zkp runs and
  # gates it at 100%, and no step anywhere reads a suite-latest cell's
  # own coverage data. What the suite cells lose is the printed
  # per-cell number, which was already known short of the real one --
  # missing the module and the files that skip without the zkp flag --
  # and was never itself gated
  deps-latest:
    uses: btclib-org/.github/.github/workflows/reusable-deps-latest.yml@main
    with:
      runners: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      python-versions: '["3.11", "3.14"]'
      submodules: true
      fetch-depth: 0

  # coverage's fail_under of 100, which the cells above cannot hold and
  # which this workflow would otherwise stop watching altogether. The
  # tool that measures it is upgraded here like everything else:
  # pytest-cov comes from the test group and coverage with it. Where a
  # release of either moves the total, what goes red is test.yml's
  # coverage job, which `test: every job passed` waits on -- a merge
  # blocked on a branch whose author changed none of it, and so exactly
  # what this workflow reports a day ahead of the dependabot pull
  # request the cron above sits in front of.
  #
  # The first two runs below are the whole suite, tests/hook_pins_test.py
  # included, and --cov-fail-under=0 gives up a run's coverage floor
  # rather than a failing test. So an upgrade that moves one of that
  # hook's declarations fails the first run, and the steps after it --
  # the union among them -- never run. The header above is what tells
  # that red apart from the one this job watches for.
  #
  # No matrix, and the interpreter is .python-version's, which is the
  # shape of the job this predicts: coverage is a property of the python
  # wrapper layer rather than of the platform. test.yml's coverage job
  # carries that reasoning, and the reason each of the runs below is
  # short of 100 on its own; what belongs to this job and not to that
  # one is the upgrade in front of them
  coverage-latest:
    name: Measure coverage against the latest dependencies, gated at 100%
    runs-on: ubuntu-latest
    # the extension is built once per run below rather than once for the
    # job, and on a cold uv cache when a dependency moved
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # both vendored libraries: the flagged run below compiles
          # secp256k1-zkp, which a run without the flag does not
          submodules: true

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Upgrade every dependency to its latest release
        run: uv lock --upgrade

      # each run names its own data file and is gated at zero, the
      # files being combined below: 100 is asked for of the union, at
      # the last step, and nowhere else
      - name: Run the suite against a static build
        env:
          COVERAGE_FILE: coverage-data-static
        run: >
          uv run --locked --no-default-groups --group test pytest
          --cov-fail-under=0

      # --reinstall-package and --no-cache here and below because this
      # run and the one after it are each selected by an environment
      # variable that neither the installed environment nor the build
      # cache is keyed on, so the extension already installed is not the
      # one the run needs
      - name: Run the suite against a dynamic build
        env:
          BTCLIB_LIBSECP256K1_DYNAMIC: "true"
          COVERAGE_FILE: coverage-data-dynamic
        run: >
          uv run --locked --no-default-groups --group test
          --reinstall-package btclib-secp256k1 --no-cache pytest
          --cov-fail-under=0

      - name: Run the tests marked zkp against the flagged build
        env:
          BTCLIB_LIBSECP256K1_ZKP: "true"
          COVERAGE_FILE: coverage-data-zkp
        run: >
          uv run --locked --no-default-groups --group test
          --reinstall-package btclib-secp256k1 --no-cache pytest
          -m zkp --cov-fail-under=0

      - name: Combine the runs
        run: >
          uv run --locked --no-default-groups --group test
          coverage combine coverage-data-static coverage-data-dynamic
          coverage-data-zkp

      # no --fail-under: coverage reads [tool.coverage.report]'s own,
      # which is where the number lives, and this is the step a
      # dependency release moving it turns red
      - name: Report the union, gated at 100%
        run: >
          uv run --locked --no-default-groups --group test
          coverage report

  # the check group, for the same reason the packaging checks live in
  # test.yml rather than in the release workflow: a release is the one place
  # where finding a problem is too late, a version being consumed by the
  # upload that carries it. twine, check-wheel-contents and pyroma are
  # pinned by uv.lock like everything else, and a new pyroma with a stricter
  # rating would otherwise fail --min 10 for the first time on a tag
  dist-latest:
    name: Build the distributions and inspect them, dependencies at latest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Upgrade every dependency to its latest release
        run: uv lock --upgrade

      # The build requirements are resolved by the build itself rather
      # than from uv.lock, so this step is at the newest release each of
      # their bounds admits whether or not the one above moved anything:
      # pyproject.toml gives each a floor and a ceiling, and uv builds in
      # an isolated environment. Which makes this the one job here that
      # would catch a build backend release breaking the wheel, so long as
      # the release is one a bound admits: past a ceiling it is not built
      - name: Build the distributions
        run: |
          uv build --sdist
          uv build --wheel

      - name: Validate them
        run: |
          uv run --locked --only-group check twine check --strict dist/*
          uv run --locked --only-group check check-wheel-contents dist/*.whl
          uv run --locked --only-group check pyroma --min 10 dist/*.tar.gz
