---
name: vendored vectors

# tests/README.md pins every vendored test vector to a commit and a git
# blob SHA-1, with a documented manual procedure to re-check one. How
# many there are is that file's to say and not this one's. This runs
# that procedure weekly instead, over every pin the script can check,
# and opens or updates an issue on drift rather than fixing anything:
# refreshing a vector file is a decision the script does not get to
# make. It also hashes each vendored file and compares the blob with
# the README's and with upstream's at the pinned commit; a mismatch
# fails the run. Matches a sibling repository's own workflow of the
# same name, script included.
#
# The `check` job is btclib-org/.github's reusable-vendored-vectors.yml,
# called at @main so a fix there reaches this tree in one landing
# (section 10 of its README.md): the checkout, the interpreter setup and
# the re-check itself are written there. What stays here is the trigger,
# the cron minute, the concurrency group, the ledger this tree checks and
# the interpreter it pins. `pin` is written out below instead, and
# `zkp-pin` is a call to zkp-pin.yml: each verifies this tree's own
# submodule against named maintainer fingerprints.
#
# issues: write is what the calling job grants. The called workflow's own
# comments argue why it takes it and which triggers may write to the
# tracker, which is not this file's to say; links.yml's own comment is
# where the opposite choice is argued

on:
  schedule:
    # Monday, hour 03: the calendar opens the week with the data a tree
    # ships and did not write, and this asks whether what upstream serves
    # is still what is vendored here. Weekly rather than monthly, which
    # is what the grid has to give: a vector file drifts when upstream
    # edits it in place, and the sample rate for that was never derived
    # from the subject.
    # The time is the organization grid -- section 10 of
    # btclib-org/.github's README.md -- and not this file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below, and through the
    # pull_request trigger further down.
    - cron: "8 3 * * 1"
  workflow_dispatch:
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition of every job here, the called one's included,
    # withheld while it was a draft: the default types do not include it,
    # and without it a readied pull request would wait for its next push
    # to be checked at all.
    # closed joins them for a different reason: merging or closing a pull
    # request is neither a push nor a synchronize, so a run still held in
    # this pull request's own concurrency group survives it unless the
    # closed event's own run also lands there. The concurrency block
    # below is what decides whether that landing cancels it or only
    # queues behind it (#523) -- this trigger only supplies the event the
    # two cases are told apart by. "This pull request's
    # own group" is the part github.ref alone gets wrong: for a closed,
    # merged pull request it resolves to the base branch's ref, which
    # this workflow has no push trigger to collide with, but the weekly
    # schedule and a workflow_dispatch both also run on the default
    # branch and would resolve to that same ref. The concurrency block
    # below groups by the pull request's own number instead, immune to
    # that under any action
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      # what a paths list costs is the wait one run adds to the checks a
      # pull request already has, which is how section 10 of the standard
      # weighs a paths-filtered pull_request on a calendar workflow --
      # not how many branches the list selects. Every path below is one
      # test.yml's `prose` pattern does not exempt, so a branch selected
      # here runs the wheel and suite matrix anyway, against a run of this
      # workflow that is a script and a keyserver fetch. The durations are
      # read back rather than assumed:
      #
      #     gh run list --repo btclib-org/btclib-secp256k1 \
      #       --workflow vendored-vectors.yml \
      #       --json createdAt,updatedAt,conclusion
      #
      # and the same call for test.yml is what it is compared against
      - .github/workflows/vendored-vectors.yml
      - .github/scripts/check_vendored_vectors.py
      # the check job's ledger, which its `ledgers` input names again: a
      # paths filter cannot read a job's input, so the path is written
      # in both places
      - tests/README.md
      # the pin job below, and the two things it is about: the gitlink is
      # a path like any other on a pull request -- #106, which moved the
      # submodule to 0.8.0, has `secp256k1` among its changed files -- so
      # the run that answers whether a bump is a signed upstream release
      # is the run on the bump itself
      - secp256k1
      # the zkp-pin job's own equivalent (issue #613), same reasoning:
      # the commit README.md declares is a gitlink move on the pull
      # request that makes it
      - secp256k1-zkp
      - .github/workflows/zkp-pin.yml
      - README.md

permissions:
  contents: read

concurrency:
  # github.event.pull_request.number, not github.ref alone, is what a
  # pull_request run of any action groups by -- the pull_request
  # trigger's own comment above has the reasoning. Neither schedule nor
  # workflow_dispatch carries pull_request context, so github.ref is
  # still what groups either, unchanged
  group: vendored-vectors-${{ github.event.pull_request.number || github.ref }}
  # true everywhere but one event -- a pull request closed by a merge --
  # for the reason links.yml gives at this key, this workflow having no
  # push trigger either: nothing runs it on the commit a merge creates
  cancel-in-progress: ${{ !(github.event.action == 'closed' && github.event.pull_request.merged) }}

jobs:
  # the tracking issue is this job's to open, close or edit, and only this
  # job's: pin and zkp-pin below report by going red, so they keep the
  # workflow's own contents: read. A called workflow can be granted no
  # more than the calling job holds, so the grant is written here rather
  # than left to the callee
  check:
    uses: btclib-org/.github/.github/workflows/reusable-vendored-vectors.yml@main
    permissions:
      contents: read
      issues: write # gh issue create/edit/close, in the called workflow
    with:
      # tests/README.md, whose entries are the pins the script re-reads,
      # under the title of the issue that tracks their drift
      ledgers: >-
        [{"ledger": "tests/README.md",
        "title": "Vendored vectors behind upstream"}]
      # no project dependency: the script imports only the standard
      # library and shells out to gh, which every GitHub-hosted runner
      # already has, so this is the interpreter this tree chooses to run
      # it under and not one it needs
      python-version: "3.15"

  # the network half of the submodule pin check, whose offline half is the
  # `submodule-pin` hook. That one asks whether the tag README.md names
  # resolves, in the vendored clone, to the commit this tree pins -- two
  # things already on the machine, which is what lets it gate a commit.
  # This asks the two that need somebody else to answer: whether that tag
  # is the one upstream publishes, and whether it carries the signature of
  # a libsecp256k1 maintainer. `submodule-pin-release` in release.yml asks
  # the first of those before publishing and neither of them earlier,
  # which is what issue #126 is about.
  #
  # A sentinel and not a gate, for the reason every network check here is
  # one: a keyserver that is down is nothing a pull request introduced. It
  # runs on the pull request that moves the pin all the same -- the paths
  # filter above is what does that -- because that is where the answer is
  # wanted while acting on it is still free.
  #
  # It opens no issue where the job above does, and the asymmetry is in
  # the subject rather than in the effort. A vendored vector file drifts
  # because upstream edits it in place, with nothing here changing and
  # nobody looking, which is exactly what an opened issue is for. A pin
  # cannot drift: it moves only in a commit of this repository. So the
  # scheduled run here is a backstop against upstream retagging, or a
  # signature that stops verifying, and a red run says all of that.
  pin:
    name: Check the pinned libsecp256k1 release
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # shallow is enough: the one tag this needs is fetched below,
          # from upstream, which is the point of fetching it at all
          submodules: true

      # the fingerprints are libsecp256k1's own, the table in its
      # SECURITY.md, recorded here rather than read out of the vendored
      # tree at check time: a key list taken from the same place as the
      # tag is a list whoever controls that place also writes. Upstream
      # asks a human for the same separation in its own README, the step
      # that cross-references each fingerprint against a source its
      # owner controls. keys.openpgp.org because that is the keyserver
      # its SECURITY.md names in the command it gives
      - name: Import the libsecp256k1 maintainer keys
        env:
          # Pieter Wuille, Tim Ruffing, Sebastian Falbesoner
          FINGERPRINTS: >-
            133EAC179436F14A5CF1B794860FEB804E669320
            09E03F871092E40E106E902B33BC86AB80FF5516
            6A8F9C266528E25AEB1D7731C2371D91CB716EA7
        run: |
          read -ra fingerprints <<< "$FINGERPRINTS"
          for fingerprint in "${fingerprints[@]}"; do
            gpg --keyserver hkps://keys.openpgp.org --recv-keys "$fingerprint"
          done

      # `git tag -v` and not `git ls-remote`: the second answers which
      # commit a tag names today, which is what release.yml compares and
      # is a claim by whoever served the answer. The signature is on the
      # tag object, so the object has to be fetched to be verified
      - name: The pin is the signed upstream release README.md names
        run: |
          named=$(sed -n 's|.*secp256k1/releases/tag/\(v[0-9][0-9.]*\).*|\1|p' README.md | head -1)
          pinned=$(git ls-tree HEAD secp256k1 | awk '{print $3}')
          if [ -z "$named" ]; then
            echo "::error::README.md names no libsecp256k1 release"
            exit 1
          fi
          git -C secp256k1 fetch --force origin "refs/tags/$named:refs/tags/$named"
          git -C secp256k1 tag -v "$named"
          tagged=$(git -C secp256k1 rev-parse "$named^{commit}")
          echo "upstream's $named is $tagged; the submodule is pinned to $pinned"
          if [ "$tagged" != "$pinned" ]; then
            echo "::error::the submodule is pinned to $pinned, which is not $named"
            exit 1
          fi

  # the zkp pin's delta and signer, in zkp-pin.yml, which release.yml calls
  # too. A sentinel here and not a gate, as `pin` above is; the comment
  # of that file has the question and the keys
  zkp-pin:
    name: Check the pinned secp256k1-zkp commit
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    uses: ./.github/workflows/zkp-pin.yml # zizmor: ignore[self-repository]
