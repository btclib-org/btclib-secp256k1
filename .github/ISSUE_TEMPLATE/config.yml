---
# the forms already say which project a report belongs in;
# these links are the same routing, offered before the report is written
# rather than after. Blank issues are off because the choice of project
# is the one thing the forms exist to get right
blank_issues_enabled: false

contact_links:
  - name: Security vulnerability
    url: https://github.com/btclib-org/btclib-secp256k1/security/advisories/new
    about: >
      Never a public issue. Report it privately here, or by email as the
      security policy describes; a flaw in libsecp256k1 itself goes to
      its own address, upstream.

  - name: Something in btclib, not in the bindings
    url: https://github.com/btclib-org/btclib/issues
    about: >
      Anything with state of its own — a wallet, a transaction, a signing
      session — belongs in the library these bindings are for.

  # one row per vendored library: a contact link carries a single url, so
  # a row naming both libraries in its text would still send the reporter
  # to one of the two trackers
  - name: Something in libsecp256k1 itself
    url: https://github.com/bitcoin-core/secp256k1/issues
    about: >
      The cryptography is upstream, vendored here as a submodule and only
      ever read from. This is what answers outside btclib_secp256k1.zkp.

  - name: Something in secp256k1-zkp itself
    url: https://github.com/BlockstreamResearch/secp256k1-zkp/issues
    about: >
      Blockstream Research's fork of libsecp256k1, vendored as a submodule
      of its own. This is what answers under btclib_secp256k1.zkp.
